<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>China Park · Gerenciador do Guia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --marinho:#2F3855; --coral:#FF4546; --verde:#57A68C; --ambar:#F7B846; --creme:#F3EEE8;
  --verde-txt:#2F8A6B; --ambar-txt:#B07D12; --coral-txt:#D93B3C; --muted:#6b7280;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Lexend',-apple-system,sans-serif;background:var(--creme);color:var(--marinho);min-height:100vh}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

.hd{background:var(--marinho);padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.hd h1{font-family:'Lora',serif;font-size:1.05rem;color:#fff;font-weight:600;flex:1;min-width:200px}
.hd .sp{flex:1}
.btn{border:0;border-radius:99px;padding:9px 18px;font-size:.8rem;font-weight:600}
.btn-pub{background:var(--verde);color:#fff}
.btn-pub:disabled{opacity:.6}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 80px}
.status{font-size:.78rem;color:var(--muted);margin:4px 2px 14px}
.status b{color:var(--verde-txt)}
.status.dirty b{color:var(--coral-txt)}

.cat{background:#fff;border-radius:16px;padding:0;margin-bottom:14px;box-shadow:0 1px 4px rgba(47,56,85,.07);overflow:hidden}
.cat summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:15px 16px}
.cat summary::-webkit-details-marker{display:none}
.cat summary h2{font-family:'Lora',serif;font-size:1rem;padding-left:9px;border-left:4px solid var(--ambar);flex:1}
.cat summary .qt{font-size:.68rem;font-weight:600;color:var(--muted);background:var(--creme);border-radius:99px;padding:3px 10px}
.cat summary .chev{color:var(--muted);font-size:.8rem;transition:transform .18s}
.cat[open] summary .chev{transform:rotate(90deg)}
.cat[open] summary{border-bottom:1px solid var(--creme)}
.cat .cat-body{padding:6px 16px 16px}
.item{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--creme)}
.item:last-of-type{border-bottom:0}
.item .em{font-size:1.15rem;width:34px;text-align:center;flex:none}
.item .nm{flex:1;font-size:.85rem;font-weight:500}
.item .tp{font-size:.62rem;font-weight:600;letter-spacing:.04em;color:var(--muted);background:var(--creme);
  border-radius:99px;padding:3px 9px;flex:none}
.item .ed{border:1px solid rgba(47,56,85,.15);background:#fff;border-radius:99px;padding:6px 14px;font-size:.72rem;font-weight:600;flex:none}
.add{margin-top:10px;background:none;border:1px dashed rgba(47,56,85,.25);color:var(--muted);
  border-radius:10px;padding:8px 14px;font-size:.75rem;width:100%}

/* editor */
.editor{display:none}
body.editing .lista{display:none}
body.editing .editor{display:block}
.ed-card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 4px rgba(47,56,85,.07)}
.field{margin-bottom:14px}
.field label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.03em}
.field input{width:100%;padding:11px 13px;border:2px solid rgba(47,56,85,.12);border-radius:10px;font-family:inherit;font-size:.9rem;outline:none}
.field input:focus{border-color:var(--ambar)}
.row2{display:grid;grid-template-columns:1fr 90px;gap:10px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;position:sticky;top:64px;z-index:10;background:#fff;padding:6px 0}
.tb{border:1px solid rgba(47,56,85,.15);background:var(--creme);border-radius:8px;padding:7px 12px;font-size:.78rem;font-weight:600}
.canvas{border:2px solid rgba(47,56,85,.12);border-radius:12px;padding:16px;min-height:260px;outline:none;
  font-size:.9rem;font-weight:300;line-height:1.75;color:#3d4358}
.canvas:focus{border-color:var(--ambar)}
.canvas p{margin-bottom:12px}
.canvas h4{font-family:'Lora',serif;font-weight:600;font-size:1.02rem;color:var(--marinho);margin:22px 0 10px;padding-left:9px;border-left:3px solid var(--ambar)}
.canvas ul,.canvas ol{margin:0 0 12px 20px}
.canvas strong{font-weight:600;color:var(--marinho)}
.canvas a{color:var(--verde-txt);text-decoration:underline}
.canvas .kvs{background:var(--creme);border-radius:14px;padding:6px 14px;margin:10px 0 16px}
.canvas .kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed rgba(47,56,85,.14)}
.canvas .kv b{color:var(--verde-txt)}
.canvas table{width:100%;border-collapse:collapse;margin:6px 0 14px}
.canvas table.menu td{padding:9px 6px;border-bottom:1px solid var(--creme);vertical-align:top}
.canvas .mprice{white-space:nowrap;text-align:right;font-weight:600;color:var(--verde-txt)}
.canvas .mdesc{font-size:.78rem;color:var(--muted)}
.canvas details.faq{border:1px solid rgba(47,56,85,.1);border-radius:12px;margin-bottom:10px;padding:6px 10px}
.ed-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn-ok{background:var(--marinho);color:#fff}
.btn-cancel{background:#fff;border:1px solid rgba(47,56,85,.2);color:var(--marinho)}
.btn-del{background:#fff;border:1px solid var(--coral);color:var(--coral-txt);margin-left:auto}
.hint{font-size:.72rem;color:var(--muted);margin-top:8px}
.reset{background:none;border:0;color:var(--muted);font-size:.72rem;text-decoration:underline;margin-top:20px}
</style>
</head>
<body>
<header class="hd">
  <h1>🛠️ Gerenciador do Guia do Hóspede</h1>
  <span class="sp"></span>
  <a class="btn btn-ghost" href="portal.html">← Portal</a>
  <a class="btn btn-ghost" href="guia.html" target="_blank">Ver guia</a>
  <button class="btn btn-pub" id="pub" onclick="publicar()">Publicar</button>
</header>

<main class="wrap">
  <p class="status" id="status">Carregando…</p>

  <div class="lista" id="lista"></div>

  <div class="editor">
    <div class="ed-card">
      <div class="row2">
        <div class="field"><label>TÍTULO</label><input id="f-t"></div>
        <div class="field"><label>EMOJI</label><input id="f-e" maxlength="4" style="text-align:center;font-size:1.3rem"></div>
      </div>
      <div class="field" id="f-url-wrap" style="display:none"><label>ENDEREÇO DO LINK</label><input id="f-url"></div>
      <div id="content-wrap">
        <div class="toolbar">
          <button class="tb" onclick="fmt('bold')"><b>B</b></button>
          <button class="tb" onclick="fmt('italic')"><i>I</i></button>
          <button class="tb" onclick="fmt('formatBlock','h4')">Título</button>
          <button class="tb" onclick="fmt('formatBlock','p')">Texto</button>
          <button class="tb" onclick="fmt('insertUnorderedList')">• Lista</button>
          <button class="tb" onclick="addLink()">🔗 Link</button>
          <button class="tb" onclick="fmt('removeFormat')">Limpar</button>
        </div>
        <div class="canvas" id="canvas" contenteditable="true"></div>
        <p class="hint">Edite como num documento: selecione o texto e use os botões acima. O visual aqui é o mesmo que o hóspede vê.</p>
      </div>
      <div class="ed-actions">
        <button class="btn btn-ok" onclick="aplicar()">Aplicar</button>
        <button class="btn btn-cancel" onclick="fecharEditor()">Cancelar</button>
        <button class="btn btn-del" id="del" onclick="excluir()">Excluir página</button>
      </div>
    </div>
  </div>

  <button class="reset" onclick="restaurar()">Restaurar conteúdo padrão do guia</button>
</main>

<script>
// Conteúdo padrão (o mesmo embutido no guia). A versão publicada vive no banco (chave 'guia').
var DEFAULT_G = {"cats": [{"id": "hoje", "title": "Hoje no China Park", "items": [{"slug": "programacao", "t": "Programação da Recreação", "e": "🎉", "badge": "AO VIVO", "ext": "recreacao.html"}, {"slug": "cinema-sessoes", "t": "Cinema — Sessões", "e": "🎬", "ext": "cinema.html"}, {"slug": "musica", "t": "Música ao Vivo", "e": "🎸", "ext": "musica.html"}]}, {"id": "atividades", "title": "Atividades inclusas", "items": [{"slug": "teleferico", "t": "Teleférico", "e": "🚡"}, {"slug": "trenzinho", "t": "Trenzinho", "e": "🚂"}, {"slug": "brinquedao", "t": "Brinquedão", "e": "🎠"}, {"slug": "parque-aquatico", "t": "Parque Aquático", "e": "🏊"}, {"slug": "centro-termal", "t": "Centro Termal", "e": "♨️"}, {"slug": "cinema", "t": "Cine-Chininha", "e": "🍿"}, {"slug": "casa-de-campo", "t": "Casa de Campo", "e": "🏡"}, {"slug": "lagos-pesca", "t": "Lagos para Pesca", "e": "🎣"}, {"slug": "pedalinhos", "t": "Pedalinhos", "e": "🚣"}, {"slug": "trilha", "t": "Trilha Ecológica", "e": "🥾"}, {"slug": "academia", "t": "Academia", "e": "🏋️"}, {"slug": "quadra-coberta", "t": "Quadra Coberta", "e": "🏀"}, {"slug": "salao-jogos", "t": "Salão de Jogos", "e": "🎱"}, {"slug": "campo-society", "t": "Campo Society", "e": "⚽"}, {"slug": "quadra-tenis", "t": "Quadra de Tênis", "e": "🎾"}, {"slug": "beach-tennis", "t": "Beach Tennis", "e": "🏐"}]}, {"id": "aventuras", "title": "Aventuras (à parte)", "items": [{"slug": "tirolesa", "t": "Tirolesa", "e": "🪂"}, {"slug": "arvorismo", "t": "Arvorismo", "e": "🌳"}, {"slug": "vara-pesca", "t": "Aluguel de Vara de Pesca", "e": "🪝"}]}, {"id": "comer", "title": "Comer & Beber", "items": [{"slug": "restaurante-gourmet", "t": "Centro Gourmet", "e": "🍽️"}, {"slug": "restaurante-lagos", "t": "Restaurante dos Lagos", "e": "🥗"}, {"slug": "servicos-alimentacao", "t": "Serviços de Alimentação", "e": "🍴"}, {"slug": "cardapio-lanchonete", "t": "Cardápio da Lanchonete", "e": "🍔"}, {"slug": "cardapio-bebidas", "t": "Cardápio de Bebidas", "e": "🍹"}, {"slug": "copa-baby", "t": "Copa Baby (24h)", "e": "🍼"}, {"slug": "emporio", "t": "Empório Gava", "e": "🛒"}, {"slug": "conveniencia", "t": "Conveniência", "e": "🏪"}]}, {"id": "servicos", "title": "Serviços & Informações", "items": [{"slug": "informacoes", "t": "Informações Gerais", "e": "ℹ️"}, {"slug": "checkout", "t": "Check-out", "e": "🧳"}, {"slug": "servico-quarto", "t": "Serviço de Quarto", "e": "🛏️"}, {"slug": "toalhas", "t": "Toalhas para Piscina", "e": "🏖️"}, {"slug": "emprestimos", "t": "Empréstimos", "e": "🤝"}, {"slug": "lavanderia", "t": "Lavanderia", "e": "👕"}, {"slug": "primeiros-socorros", "t": "Primeiros Socorros", "e": "⛑️"}, {"slug": "achados-perdidos", "t": "Achados e Perdidos", "e": "🔍"}, {"slug": "pet", "t": "Pet Friendly", "e": "🐾"}, {"slug": "spa", "t": "Essence Spa", "e": "💆", "dest": 1}, {"slug": "capela", "t": "Capela Ecumênica", "e": "⛪"}]}, {"id": "planeje", "title": "Planeje-se", "items": [{"slug": "espacos", "t": "Espaços do Resort", "e": "🗺️"}, {"slug": "regiao", "t": "Região das Montanhas", "e": "🏔️", "ext": "https://view.publitas.com/deolhonarua/click-nas-montanhas/page/1"}, {"slug": "cotacao", "t": "Cotação e Reservas", "e": "📅", "ext": "https://book.omnibees.com/hotelresults?q=10771"}, {"slug": "avalie", "t": "Avalie-nos", "e": "⭐", "ext": "https://e-qr.codes/fdcfb20875"}]}], "pages": {"teleferico": {"t": "Teleférico", "e": "🚡", "html": "<p>O teleférico do China Park é uma das principais atrações do resort e um verdadeiro cartão-postal da região. Primeiro e único teleférico do Espírito Santo, há mais de 20 anos proporciona uma vista privilegiada da natureza local.</p><h4>Horário de funcionamento</h4><div class=\"kvs\"><div class=\"kv\"><span>Segunda e quinta</span><b>11h–12h e 15h–16h</b></div><div class=\"kv\"><span>Terça e quarta</span><b>11h–12h</b></div><div class=\"kv\"><span>Sexta</span><b>manutenção preventiva</b></div><div class=\"kv\"><span>Sábado e domingo</span><b>9h30–12h e 14h–17h</b></div></div><h4>Meses de férias (janeiro, julho e dezembro)</h4><div class=\"kvs\"><div class=\"kv\"><span>Segunda a sexta</span><b>10h30–12h e 15h–17h</b></div><div class=\"kv\"><span>Sábado e domingo</span><b>9h30–12h e 14h–17h</b></div></div><p class=\"obs\">Em julho, o horário de férias vale de 10/07 a 26/07. O funcionamento do teleférico e da tirolesa pode sofrer alterações sem aviso prévio por condições meteorológicas ou imprevistos operacionais, sempre visando a segurança de todos.</p>", "cat": "atividades"}, "trenzinho": {"t": "Trenzinho", "e": "🚂", "html": "<p>Piuí! Piuíí! 🚂 Embarque nessa aventura com nossos recreadores no trem mais animado das montanhas capixabas!</p><h4>Como embarcar</h4><ul><li>É <strong>obrigatório retirar a ficha de embarque</strong>, em frente ao Brinquedão.</li><li>As fichas da manhã são distribuídas 10 minutos antes do primeiro embarque do dia.</li><li>Para o último passeio do dia, a distribuição acontece 10 minutos antes do embarque da tarde.</li></ul><h4>Horários de saída</h4><div class=\"kvs\"><div class=\"kv\"><span>Sábado a segunda</span><b>a partir das 9h10 e das 15h30</b></div><div class=\"kv\"><span>Terça a sexta</span><b>a partir das 9h40 e das 15h30</b></div><div class=\"kv\"><span>Férias (jan, jul e dez)</span><b>todos os dias, 9h10 e 15h30</b></div></div><p class=\"obs\">Em julho, o horário de férias vale de 11/07 a 26/07.</p><h4>Bom saber</h4><ul><li>O passeio dura cerca de <strong>40 minutos</strong>.</li><li>Prefere ir sem o trenzinho? Deixe o carro na entrada da estrada da Casa de Campo e siga a pé — a entrada de veículos não é permitida por causa dos bichinhos.</li><li>Os animais ficam soltos para interação apenas durante os horários do trenzinho.</li></ul>", "cat": "atividades"}, "brinquedao": {"t": "Brinquedão", "e": "🎠", "html": "<h4>Horário de funcionamento</h4><div class=\"kvs\"><div class=\"kv\"><span>Domingo a quarta</span><b>9h às 21h</b></div><div class=\"kv\"><span>Quinta-feira</span><b>10h às 21h</b></div><div class=\"kv\"><span>Sexta-feira</span><b>12h às 22h</b></div><div class=\"kv\"><span>Sábado</span><b>9h às 22h</b></div><div class=\"kv\"><span>Férias (jan, jul e dez)</span><b>todos os dias, 9h às 22h</b></div></div><p class=\"obs\">Em julho, o horário de férias vale de 10/07 a 26/07.</p><p>Crianças que ainda dependem de ajuda para trocar fraldas ou ir ao banheiro devem estar sempre acompanhadas de um responsável.</p><p><a class=\"cta\" href=\"brinquedao-cadastro.html\">Fazer o cadastro das crianças →</a></p>", "cat": "atividades"}, "parque-aquatico": {"t": "Parque Aquático", "e": "🏊", "html": "<h4>Horários</h4><div class=\"kvs\"><div class=\"kv\"><span>Piscinas</span><b>9h às 17h (todos os dias)</b></div><div class=\"kv\"><span>Toboáguas e cascata</span><b>10h às 17h</b></div></div><h4>Estrutura</h4><ul><li>4 piscinas (adultas e infantis)</li><li>2 toboáguas</li><li>1 cascata artificial</li></ul><h4>Altura mínima por piscina</h4><p>Para a segurança de todos, cada piscina tem altura mínima obrigatória — mesmo acompanhadas de um responsável, crianças abaixo da altura exigida não podem entrar.</p><div class=\"kvs\"><div class=\"kv\"><span>1ª piscina</span><b>mínimo 140 cm</b></div><div class=\"kv\"><span>2ª piscina</span><b>mínimo 120 cm</b></div><div class=\"kv\"><span>3ª piscina</span><b>mínimo 90 cm</b></div><div class=\"kv\"><span>4ª piscina (infantil)</span><b>sem restrição</b></div></div><p>Agradecemos a compreensão e desejamos momentos de lazer com segurança! 💦</p>", "cat": "atividades"}, "centro-termal": {"t": "Centro Termal", "e": "♨️", "html": "<p>Piscinas aquecidas, ofurôs e sauna: nada melhor do que fechar o dia em águas quentinhas aproveitando o friozinho das montanhas capixabas!</p><h4>Horário de funcionamento</h4><div class=\"kvs\"><div class=\"kv\"><span>Segunda, terça e quinta</span><b>11h às 21h</b></div><div class=\"kv\"><span>Quarta</span><b>14h às 21h</b></div><div class=\"kv\"><span>Sexta e sábado</span><b>10h às 22h</b></div><div class=\"kv\"><span>Domingo</span><b>10h às 21h</b></div><div class=\"kv\"><span>Sauna</span><b>17h às 20h</b></div><div class=\"kv\"><span>Férias (jan, jul e dez)</span><b>todos os dias, 10h às 22h</b></div></div><h4>Estrutura</h4><ul><li><strong>20 ofurôs</strong> — um para cada família</li><li>Duas piscinas com 1,30 m e uma com 1,10 m de profundidade</li><li>Água aquecida a <strong>32 °C</strong>, temperatura ideal para relaxar</li></ul>", "cat": "atividades"}, "cinema": {"t": "Cine-Chininha", "e": "🍿", "html": "<p>A aventura por aqui vai além da vida real — ela também ganha vida na tela do nosso <strong>Cine-Chininha</strong>! Com capacidade para 36 pessoas, o cinema tem sessões diárias com filmes que conquistaram o público no mundo inteiro.</p><p>Os horários e os filmes em cartaz são atualizados diariamente. Ah, e não se esqueça de conferir a classificação indicativa antes da sessão, combinado?</p><p>Prepare a pipoca… a próxima exibição está prestes a começar! 🍿</p><p><a class=\"cta\" href=\"cinema.html\">Ver sessões da semana →</a></p>", "cat": "atividades"}, "casa-de-campo": {"t": "Casa de Campo", "e": "🏡", "html": "<p>Nossa Casa de Campo é um cantinho especial cheio de vida! Por aqui, você e sua família podem interagir com porquinhos-da-índia, coelhos, galinhas, pássaros… e até um avestruz! 🦚</p><p>É o passeio ideal para desacelerar, respirar ar puro e viver momentos inesquecíveis longe da rotina da cidade grande.</p><div class=\"kvs\"><div class=\"kv\"><span>Duração do passeio</span><b>cerca de 40 minutos</b></div></div><h4>Como chegar</h4><ul><li>De <strong>trenzinho</strong> (consulte os horários na página do Trenzinho).</li><li>Por conta própria: deixe o carro na entrada da estrada da Casa de Campo e siga a pé. Por segurança e respeito aos animais, veículos não entram.</li></ul><p class=\"obs\">A interação com os animais acontece apenas nos horários em que o trenzinho está em funcionamento — fora deles, os bichinhos não ficam soltos.</p>", "cat": "atividades"}, "lagos-pesca": {"t": "Lagos para Pesca", "e": "🎣", "html": "<p>A pesca recreativa (<strong>pesque e solte</strong>) é permitida em todos os lagos do resort. 🎣</p><p>Não trouxe sua vara? Alugamos um kit com 1 vara de pesca + 1 potinho de ração.</p><div class=\"kvs\"><div class=\"kv\"><span>Valor do kit</span><b>R$ 10,00</b></div></div><p class=\"obs\">Ao final do dia, devolva a vara no mesmo local da retirada. Aproveite esse momento de tranquilidade em meio à natureza!</p>", "cat": "atividades"}, "pedalinhos": {"t": "Pedalinhos", "e": "🚣", "html": "<p>Um passeio gostoso e repleto de natureza para a família! Cada pedalinho comporta até 2 adultos e 1 criança de colo. 🚣</p><div class=\"kvs\"><div class=\"kv\"><span>Horário de funcionamento</span><b>9h às 16h30</b></div></div><h4>Atenção</h4><ul><li>É obrigatório o uso de colete salva-vidas.</li><li>Crianças só podem usar o pedalinho acompanhadas dos pais ou de um responsável.</li></ul>", "cat": "atividades"}, "trilha": {"t": "Trilha Ecológica", "e": "🥾", "html": "<p>Explore nossa trilha em meio à natureza: são cerca de <strong>4 km</strong> de percurso, repletos de beleza e momentos de superação! 🥾</p><h4>Duas formas de aproveitar</h4><ul><li><strong>Com a equipe de Recreação</strong> — confira dia e horário no quadro de avisos em frente à antiga recepção (perto da loja de conveniência).</li><li><strong>Por conta própria</strong>, durante o dia.</li></ul><p>Na trilha, desafiamos o corpo e alimentamos a alma. Cada passo é uma chance de se reconectar com a natureza. Prepare-se para uma experiência transformadora!</p>", "cat": "atividades"}, "academia": {"t": "Academia", "e": "🏋️", "html": "<div class=\"kvs\"><div class=\"kv\"><span>Funcionamento</span><b>todos os dias, 7h às 20h</b></div></div><h4>Como acessar</h4><ul><li>Abra a chave de acesso pelo botão abaixo.</li><li>Aproxime o QR Code do leitor na porta da academia.</li><li>O acesso é liberado automaticamente.</li></ul><p><a class=\"cta\" href=\"https://drive.google.com/file/d/1ZF80zFVW8O35KfkJiWFzCuFjlCqcKF79/view?usp=sharing\" target=\"_blank\" rel=\"noopener\">Abrir chave de acesso (QR Code) →</a></p><p class=\"obs\">Em caso de dúvidas, nossa equipe está à disposição para ajudar.</p>", "cat": "atividades"}, "quadra-coberta": {"t": "Quadra Coberta", "e": "🏀", "html": "<p>Disponibilizamos uma quadra coberta para lazer e prática esportiva, faça chuva ou faça sol. 🏀</p><h4>Itens para empréstimo</h4><ul><li>Rede</li><li>Bola de futsal</li><li>Bola de vôlei</li></ul><p>Solicite os materiais na loja de conveniência (sujeitos à disponibilidade).</p><p class=\"obs\">Antes de usar a quadra, verifique se não há atividades da Recreação marcadas para o horário.</p>", "cat": "atividades"}, "salao-jogos": {"t": "Salão de Jogos", "e": "🎱", "html": "<p>Diversão garantida, faça chuva ou sol! O Salão de Jogos fica à disposição de todos os hóspedes, em família ou entre amigos. 🎱</p><h4>O que você encontra por lá</h4><ul><li>Totó (pebolim)</li><li>Ping-pong / tênis de mesa</li><li>Sinuca</li><li>Jogos de tabuleiro e cartas (Uno e outros, para empréstimo na loja de conveniência)</li><li>Jogos eletrônicos terceirizados (máquina de bichinhos, basquete eletrônico e outros)</li></ul><div class=\"kvs\"><div class=\"kv\"><span>Horário</span><b>todos os dias, 10h às 22h</b></div></div><p class=\"obs\">Acompanha o horário do Centro de Vivências. Divirta-se com respeito aos demais hóspedes!</p>", "cat": "atividades"}, "campo-society": {"t": "Campo Society", "e": "⚽", "html": "<p>Nosso campo society de grama sintética fica à disposição dos hóspedes em qualquer horário para momentos de lazer e esporte. ⚽</p><ul><li>Bola disponível para empréstimo na loja de conveniência (sujeita à disponibilidade).</li><li>Na retirada, um valor de <strong>caução</strong> é lançado na pulseira (tag) e estornado na devolução do item.</li></ul><p class=\"obs\">Antes de usar o campo, confirme com a equipe se não há programação da Recreação para o horário.</p>", "cat": "atividades"}, "quadra-tenis": {"t": "Quadra de Tênis", "e": "🎾", "html": "<p>A quadra de tênis fica à disposição dos hóspedes durante todo o dia. 🎾</p><p class=\"obs\">A quadra não possui refletores, por isso o uso é restrito ao período diurno. No momento não temos raquetes e bolinhas para empréstimo — traga seus próprios itens.</p>", "cat": "atividades"}, "beach-tennis": {"t": "Beach Tennis", "e": "🏐", "html": "<p>A quadra de beach tennis fica à disposição dos hóspedes durante todo o dia. 🏐</p><p>Raquetes e bolinhas estão disponíveis para empréstimo na loja de conveniência — basta solicitar e verificar a disponibilidade.</p><p class=\"obs\">A quadra não possui refletores, por isso o uso é restrito ao período diurno. Aproveite para praticar seu saque e se divertir ao ar livre!</p>", "cat": "atividades"}, "tirolesa": {"t": "Tirolesa", "e": "🪂", "html": "<p>Com <strong>107 metros de altura</strong> e <strong>669 metros de extensão</strong>, nossa tirolesa é a maior do Espírito Santo e a terceira maior do Brasil! Ao saltar da plataforma, você cruza o resort de ponta a ponta com uma vista aérea espetacular. 🪂</p><div class=\"kvs\"><div class=\"kv\"><span>Velocidade</span><b>até 65 km/h</b></div><div class=\"kv\"><span>Duração do trajeto</span><b>cerca de 1 minuto</b></div><div class=\"kv\"><span>Modalidade</span><b>individual ou em dupla</b></div></div><p class=\"obs\">Atividade realizada conforme as normas da ABNT.</p><h4>Requisitos para participar</h4><ul><li>Peso entre 40 kg e 120 kg</li><li>Altura mínima de 1,30 m</li><li>Idade mínima de 7 anos</li></ul><h4>Horário de funcionamento</h4><div class=\"kvs\"><div class=\"kv\"><span>Segunda e quinta</span><b>11h–12h e 15h–16h</b></div><div class=\"kv\"><span>Terça e quarta</span><b>11h–12h</b></div><div class=\"kv\"><span>Sexta</span><b>fechada para manutenção</b></div><div class=\"kv\"><span>Sábado e domingo</span><b>10h–12h e 14h–17h</b></div></div><h4>Meses de férias (janeiro, julho e dezembro)</h4><div class=\"kvs\"><div class=\"kv\"><span>Segunda a sexta</span><b>10h30–12h e 15h–17h</b></div><div class=\"kv\"><span>Sábado e domingo</span><b>9h30–12h e 14h–17h</b></div></div><p class=\"obs\">Em julho, o horário de férias vale de 11/07 a 26/07. Atividade à parte — consulte os valores no local. Horários podem mudar sem aviso prévio por condições climáticas, sempre pela segurança de todos.</p>", "cat": "aventuras"}, "arvorismo": {"t": "Arvorismo", "e": "🌳", "html": "<p>Adrenalina e diversão nas alturas! Nosso circuito de aventura fica na área central do resort: são <strong>16 obstáculos suspensos a 8 metros</strong> de altura, num percurso de 200 metros com pontes, teias, escadas e muito mais. 🌳</p><p>No final, a emoção chega ao auge com uma <strong>tirolesa de 180 metros</strong> que cruza um lago — inesquecível!</p><h4>Informações</h4><div class=\"kvs\"><div class=\"kv\"><span>Altura mínima</span><b>1,30 m</b></div><div class=\"kv\"><span>Peso máximo</span><b>120 kg</b></div><div class=\"kv\"><span>Duração média</span><b>30 a 60 minutos</b></div><div class=\"kv\"><span>Capacidade</span><b>até 20 pessoas por grupo</b></div></div><p class=\"obs\">Sempre acompanhado por condutor especializado.</p><h4>Horários</h4><div class=\"kvs\"><div class=\"kv\"><span>Segunda e quinta</span><b>9h e 10h · 13h30 e 14h30</b></div><div class=\"kv\"><span>Terça e quarta</span><b>9h e 10h · 13h45, 15h e 16h15</b></div><div class=\"kv\"><span>Sexta</span><b>fechado para manutenção</b></div><div class=\"kv\"><span>Sábado e domingo</span><b>9h, 10h15 e 11h30 · 13h45, 15h e 16h15</b></div><div class=\"kv\"><span>Férias (jan, jul e dez)</span><b>todos os dias, 9h, 10h15 e 11h30 · 13h45, 15h e 16h15</b></div></div><p class=\"obs\">Em julho, o horário de férias vale de 11/07 a 26/07. Atividade à parte — consulte os valores no local.</p><p>Pronto para encarar esse desafio nas alturas?</p>", "cat": "aventuras"}, "vara-pesca": {"t": "Aluguel de Vara de Pesca", "e": "🪝", "html": "<p>Esqueceu de trazer sua vara de pesca? Sem problemas! Alugamos um kit com <strong>vara + potinho de ração</strong> para garantir sua diversão no lago. 🎣</p><div class=\"kvs\"><div class=\"kv\"><span>Valor do kit</span><b>R$ 10,00</b></div><div class=\"kv\"><span>Retirada e devolução</span><b>setor de terceirizados</b></div></div><p class=\"obs\">Devolva a vara até o fim da tarde, no mesmo local da retirada. Boa pescaria!</p>", "cat": "aventuras"}, "restaurante-gourmet": {"t": "Centro Gourmet", "e": "🍽️", "html": "<p>O <strong>Centro Gourmet</strong> é o nosso principal restaurante — é lá que servimos as quatro refeições diárias: café da manhã, almoço, café da tarde e jantar. 🍽️</p><h4>Segunda a quinta</h4><div class=\"kvs\"><div class=\"kv\"><span>Café da manhã</span><b>7h30 às 10h</b></div><div class=\"kv\"><span>Almoço</span><b>12h às 13h30</b></div><div class=\"kv\"><span>Café da tarde</span><b>16h às 18h</b></div><div class=\"kv\"><span>Jantar</span><b>19h30 às 21h</b></div></div><h4>Sexta, sábado e domingo</h4><div class=\"kvs\"><div class=\"kv\"><span>Café da manhã</span><b>7h30 às 10h</b></div><div class=\"kv\"><span>Almoço</span><b>12h às 14h</b></div><div class=\"kv\"><span>Café da tarde</span><b>16h às 18h</b></div><div class=\"kv\"><span>Jantar</span><b>19h30 às 21h30</b></div></div><h4>Meses de férias (janeiro, julho e dezembro)</h4><div class=\"kvs\"><div class=\"kv\"><span>Café da manhã</span><b>7h30 às 10h</b></div><div class=\"kv\"><span>Almoço</span><b>12h às 14h</b></div><div class=\"kv\"><span>Café da tarde</span><b>16h às 18h</b></div><div class=\"kv\"><span>Jantar</span><b>19h30 às 21h30</b></div></div><p class=\"obs\">Em julho, o horário de férias vale de 10/07 a 26/07. Bebidas não alcoólicas (sucos, água e refrigerantes) e sobremesas estão inclusas.</p>", "cat": "comer"}, "restaurante-lagos": {"t": "Restaurante dos Lagos", "e": "🥗", "html": "<p>O <strong>Restaurante dos Lagos</strong> opera no sistema self-service a quilo, todos os dias. 🥗</p><p>É a opção ideal para hóspedes sem refeições inclusas na hospedagem — e para visitantes do day use.</p><p class=\"obs\">Consulte os horários do dia na recepção.</p>", "cat": "comer"}, "servicos-alimentacao": {"t": "Serviços de Alimentação", "e": "🍴", "html": "<h4>Cafeteria ☕</h4><p>Um espaço especial ao lado da recepção para desfrutar sabores únicos.</p><div class=\"kvs\"><div class=\"kv\"><span>Todos os dias</span><b>9h às 19h</b></div></div><h4>Lanchonete do Centro de Vivências 🍔</h4><p>Lanches, pizzas, porções e açaí — veja o <a href=\"#/cardapio-lanchonete\">cardápio completo aqui</a>.</p><div class=\"kvs\"><div class=\"kv\"><span>Domingo a quinta</span><b>10h às 21h</b></div><div class=\"kv\"><span>Sexta e sábado</span><b>10h às 22h</b></div><div class=\"kv\"><span>Férias (10/07 a 26/07)</span><b>todos os dias, 10h às 22h</b></div></div><p class=\"obs\">Delivery no quarto: consulte os dias disponíveis pelo ramal 211.</p><h4>Quiosques 🌴</h4><p>Quiosques no Parque Aquático, na fazendinha (Casa de Campo) e no Mirante. Funcionam acompanhando o horário das atividades de cada área.</p>", "cat": "comer"}, "cardapio-lanchonete": {"t": "Cardápio da Lanchonete", "e": "🍔", "html": "<h4>Hambúrgueres gourmet</h4><table class=\"menu\"><tr><td>Royal Burguer<div class=\"mdesc\">Pão bola, molho barbecue caseiro, 180 g de hambúrguer, bacon crocante, queijo muçarela e cebola grape</div></td><td class=\"mprice\">R$ 47</td></tr><tr><td>Classic Burguer<div class=\"mdesc\">Pão bola, molho da casa, 180 g de hambúrguer, cheddar, bacon crocante, alface e tomate</div></td><td class=\"mprice\">R$ 47</td></tr><tr><td>Secrets Burguer<div class=\"mdesc\">Pão bola, molho rosé, 180 g de hambúrguer, muçarela, cebola grape, bacon crocante e salada</div></td><td class=\"mprice\">R$ 47</td></tr><tr><td>Cheese Burguer<div class=\"mdesc\">Pão bola, 180 g de hambúrguer, molho da chef, queijo muçarela, alface e tomate</div></td><td class=\"mprice\">R$ 47</td></tr><tr><td>Chicken Burguer<div class=\"mdesc\">Pão bola, molho da chef, 180 g de hambúrguer de frango, picles, blend de cheddar e catupiry, alface e tomate</div></td><td class=\"mprice\">R$ 42</td></tr></table><h4>Hambúrgueres tradicionais</h4><table class=\"menu\"><tr><td>China Burguer<div class=\"mdesc\">Pão bola, hambúrguer, queijo derretido, folhas, tomatinho fatiado e batata palha</div></td><td class=\"mprice\">R$ 27</td></tr><tr><td>China Bacon<div class=\"mdesc\">Pão bola, hambúrguer, bacon crocante, queijo derretido, folhas, tomatinho fatiado e batata palha</div></td><td class=\"mprice\">R$ 29</td></tr><tr><td>China Egg<div class=\"mdesc\">Pão bola, hambúrguer, queijo derretido, ovo, folhas, tomatinho fatiado e batata</div></td><td class=\"mprice\">R$ 27</td></tr><tr><td>China Egg Bacon<div class=\"mdesc\">Pão bola, hambúrguer, bacon crocante, ovo, folhas, tomatinho fatiado e batata palha</div></td><td class=\"mprice\">R$ 30</td></tr><tr><td>China Tudo<div class=\"mdesc\">Pão bola, hambúrguer, bacon crocante, queijo derretido, presunto, 2 ovos, folhas, tomatinho fatiado e batata palha</div></td><td class=\"mprice\">R$ 34</td></tr><tr><td>Misto Quente<div class=\"mdesc\">Pão de forma triplo, 2 fatias de queijo muçarela, 2 fatias de presunto</div></td><td class=\"mprice\">R$ 27</td></tr><tr><td>Queijo Quente<div class=\"mdesc\">Pão de forma triplo, 2 fatias de queijo muçarela</div></td><td class=\"mprice\">R$ 20</td></tr></table><h4>Petiscos</h4><table class=\"menu\"><tr><td>Mignon ao Gorgonzola<div class=\"mdesc\">Filezinho bovino em cubos salteados em azeite, mergulhados no molho gorgonzola</div></td><td class=\"mprice\">R$ 90</td></tr><tr><td>Mignon<div class=\"mdesc\">Filezinho bovino em cubos salteados em azeite ao molho de vinho tinto e tirinhas de cebola</div></td><td class=\"mprice\">R$ 86</td></tr><tr><td>Franguito (frango e queijo)<div class=\"mdesc\">Filezinho de frango em tiras e cubos de queijo minas empanados</div></td><td class=\"mprice\">R$ 69</td></tr><tr><td>Passarinho com batata<div class=\"mdesc\">Pedacinhos de frango com ossos marinados ao vinho d’alho com crocante de alho e palitos de batatinhas fritas</div></td><td class=\"mprice\">R$ 69</td></tr><tr><td>Batata frita</td><td class=\"mprice\">R$ 36</td></tr><tr><td>Batata frita com cheddar e bacon</td><td class=\"mprice\">R$ 55</td></tr></table><h4>Pizzas — 25 cm (4 fatias) R$ 65 · 30 cm (6 fatias) R$ 85</h4><table class=\"menu\"><tr><td>Calabresa<div class=\"mdesc\">Massa especial, molho italiano, muçarela, fatias de calabresa e cebola</div></td><td class=\"mprice\"></td></tr><tr><td>Três Queijos<div class=\"mdesc\">Massa especial, molho italiano, muçarela, gorgonzola e parmesão</div></td><td class=\"mprice\"></td></tr><tr><td>Peito de Peru e Catupiry<div class=\"mdesc\">Massa especial, molho italiano, muçarela, peito de peru defumado e catupiry</div></td><td class=\"mprice\"></td></tr><tr><td>Muçarela<div class=\"mdesc\">Massa especial, molho italiano e queijo muçarela</div></td><td class=\"mprice\"></td></tr><tr><td>Frango e Catupiry<div class=\"mdesc\">Massa especial, molho italiano, muçarela, frango desfiado e catupiry</div></td><td class=\"mprice\"></td></tr><tr><td>Marguerita<div class=\"mdesc\">Massa especial, molho italiano, muçarela, tomate em fatias e manjericão</div></td><td class=\"mprice\"></td></tr><tr><td>Mini pizza (brotinho)</td><td class=\"mprice\">R$ 24</td></tr></table><h4>Açaí</h4><table class=\"menu\"><tr><td>Açaí 300 g</td><td class=\"mprice\">R$ 29</td></tr><tr><td>Açaí 500 g<div class=\"mdesc\">Consulte os complementos disponíveis</div></td><td class=\"mprice\">R$ 34</td></tr></table><h4>Bebidas</h4><table class=\"menu\"><tr><td>Água mineral sem gás</td><td class=\"mprice\">R$ 5</td></tr><tr><td>Água mineral com gás</td><td class=\"mprice\">R$ 8</td></tr><tr><td>H2O</td><td class=\"mprice\">R$ 15</td></tr><tr><td>Red Bull energético</td><td class=\"mprice\">R$ 20</td></tr><tr><td>Suco Del Valle</td><td class=\"mprice\">R$ 14</td></tr><tr><td>Suco de polpa</td><td class=\"mprice\">R$ 12</td></tr><tr><td>Suco natural</td><td class=\"mprice\">R$ 14</td></tr><tr><td>Refrige >R$ 42,90</td></tr><tr><td>Mojito<div class=\"mdesc\">Rum Bacardi, limão, água com gás, hortelã e gelo</div></td><td class=\"mprice\">R$ 42,90</td></tr><tr><td>Gin Tropical<div class=\"mdesc\">Gin, suco de laranja, laranja, água com gás e gelo</div></td><td class=\"mprice\">R$ 42,90</td></tr><tr><td>Gin Tônica<div class=\"mdesc\">Gin, suco de limão, água tônica e gelo</div></td><td class=\"mprice\">R$ 42,90</td></tr><tr><td>Piña Colada<div class=\"mdesc\">Rum ou gin, leite de coco, suco de abacaxi e gelo</div></td><td class=\"mprice\">R$ 42,90</td></tr><tr><td>Aperol Spritz<div class=\"mdesc\">Aperol, espumante, água com gás e gelo</div></td><td class=\"mprice\">R$ 42,90</td></tr><tr><td>Soda Italiana (sem álcool)<div class=\"mdesc\">Xarope à escolha, água com gás e gelo</div></td><td class=\"mprice\">R$ 35,90</td></tr><tr><td>Sunrise Drink<div class=\"mdesc\">Vodka, suco de limão e laranja, groselha, Halls e gelo</div></td><td class=\"mprice\">R$ 42,90</td></tr><tr><td>Lagoa Azul<div class=\"mdesc\">Vodka, Curaçau Blue, Sprite e gelo</div></td><td class=\"mprice\">R$ 42,90</td></tr><tr><td>Corona Sunrise<div class=\"mdesc\">Tequila, suco de laranja, groselha e gelo</div></td><td class=\"mprice\">R$ 45,90</td></tr></table><h4>Cervejas long neck (330 ml)</h4><table class=\"menu\"><tr><td>Heineken / Stella Artois</td><td class=\"mprice\">R$ 18</td></tr><tr><td>Budweiser / Corona</td><td class=\"mprice\">R$ 16</td></tr><tr><td>Amstel</td><td class=\"mprice\">R$ 18</td></tr></table><h4>Sem álcool e energéticos</h4><table class=\"menu\"><tr><td>H2O</td><td class=\"mprice\">R$ 15</td></tr><tr><td>Red Bull energético</td><td class=\"mprice\">R$ 20</td></tr></table><p class=\"obs\">Valores sujeitos a alteração. Consulte também o chopp (caneca 350 ml) no balcão.</p>", "cat": "comer"}, "copa-baby": {"t": "Copa Baby (24h)", "e": "🍼", "html": "<p>Nosso Espaço Baby fica em frente ao Espaço Kids, perto do Centro Gourmet, e está <strong>aberto 24 horas</strong> para mamães e papais que precisarem. 🍼</p><h4>Estrutura</h4><ul><li>Sala de TV</li><li>Berçário</li><li>Fraldário</li><li>Copa Baby</li></ul><p>Sabemos que os horários das refeições nem sempre coincidem com as necessidades dos bebês — não hesite em chamar nossa equipe se precisar de qualquer apoio.</p>", "cat": "comer"}, "emporio": {"t": "Empório Gava", "e": "🛒", "html": "<p>O Empório Gava é o lugar perfeito para quem busca aquele clima de buteco com um toque especial! Comidinhas de boteco, bebidas geladas e um ambiente rústico e acolhedor para relaxar com a família ou entre amigos. 🍻</p><div class=\"kvs\"><div class=\"kv\"><span>Todos os dias</span><b>10h às 22h</b></div></div><p><a class=\"cta\" href=\"https://drive.google.com/file/d/1f0gI3-EOX_-EAlIqwa33ylqq_1t2bLkZ/view\" target=\"_blank\" rel=\"noopener\">Ver cardápio com valores →</a></p>", "cat": "comer"}, "conveniencia": {"t": "Conveniência", "e": "🏪", "html": "<p>Nossa loja de conveniência funciona de segunda a segunda! Lá você encontra lembrancinhas, roupas, bebidas, guloseimas, itens de higiene pessoal e muito mais. 🏪</p><h4>Horário de funcionamento</h4><div class=\"kvs\"><div class=\"kv\"><span>Segunda a quinta</span><b>9h30 às 21h30</b></div><div class=\"kv\"><span>Sexta</span><b>10h30 às 22h30</b></div><div class=\"kv\"><span>Sábado e domingo</span><b>9h30 às 21h30</b></div><div class=\"kv\"><span>Férias (jan, jul e dez)</span><b>todos os dias, 9h30 às 21h30</b></div></div><p class=\"obs\">Em julho, o horário de férias vale de 10/07 a 26/07.</p>", "cat": "comer"}, "informacoes": {"t": "Informações Gerais", "e": "ℹ️", "html": "<h4>Voltagem</h4><p>Todas as tomadas são <strong>220 V</strong>. Antes de ligar seus aparelhos, verifique se são bivolt ou compatíveis com essa voltagem.</p><h4>Ramais úteis</h4><div class=\"kvs\"><div class=\"kv\"><span>Recepção</span><b>9</b></div><div class=\"kv\"><span>Centro de Vivências (lanchonete)</span><b>211</b></div><div class=\"kv\"><span>Empório Gava</span><b>100</b></div></div><h4>Telefones</h4><p>(27) 3441-9770 · (27) 3208-0861 · (27) 99720-2553</p><h4>Wi-Fi</h4><div class=\"kvs\"><div class=\"kv\"><span>Rede</span><b>China Park</b></div><div class=\"kv\"><span>Senha</span><b>china2019</b></div></div><h4>Cobertura de celular</h4><p>Apenas pela operadora Vivo.</p><h4>Frigobar</h4><p>O frigobar é abastecido com águas sem gás — se consumidas, são lançadas na sua conta ao final da estadia. Para abastecer com outros produtos, ligue para a recepção ou adquira diretamente nos restaurantes, lanchonetes ou na loja de conveniência.</p><h4>Taxas</h4><div class=\"kvs\"><div class=\"kv\"><span>Taxa de turismo</span><b>R$ 1,90 por diária</b></div><div class=\"kv\"><span>Seguro pessoal</span><b>R$ 3,90 por pessoa</b></div><div class=\"kv\"><span>Estacionamento</span><b>R$ 10,00 por veículo</b></div></div><p class=\"obs\">Não cobramos ISS.</p><h4>Restrição alimentar</h4><p>Informe na recepção para que a cozinha seja avisada e inclua opções na produção. No café da manhã e no café da tarde já há bolos sem lactose.</p><h4>Solicitação de bolo</h4><p>Diretamente na recepção, com no mínimo 24 horas de antecedência.</p><h4>Crianças pequenas</h4><p>Crianças que dependem de ajuda (troca de fraldas, banheiro etc.) devem estar sempre acompanhadas de um responsável no Brinquedão e nas atividades da Recreação.</p><h4>Varandas</h4><p>Pedimos que não estenda roupas ou toalhas nas varandas e janelas dos chalés e apartamentos.</p>", "cat": "servicos"}, "checkout": {"t": "Check-out", "e": "🧳", "html": "<div class=\"kvs\"><div class=\"kv\"><span>Horário do check-out</span><b>até 12h (meio-dia)</b></div></div><p>Basta entregar a chave na recepção.</p><h4>Almoço no dia da saída</h4><p>Reserva com <strong>pensão completa</strong>? O almoço do dia do check-out está incluso: entregue a chave e siga direto para o restaurante, sem fila. Sem almoço incluso, aproveite o buffet a quilo do Restaurante dos Lagos.</p><h4>Quer ficar mais um pouco?</h4><p>Após o almoço, dá para aproveitar as áreas de lazer <strong>até as 17h</strong>: passe na recepção e troque a cor da sua pulseira.</p><h4>Comanda</h4><p>O fechamento da comanda é feito apenas no momento da saída do hotel, na recepção.</p><h4>Malas e transporte</h4><p>Nossa equipe ajuda com bagagens e transporte — avise com antecedência para atendermos com agilidade.</p><p>Agradecemos sua estadia conosco! 💙</p>", "cat": "servicos"}, "servico-quarto": {"t": "Serviço de Quarto", "e": "🛏️", "html": "<p>Dúvidas frequentes sobre a governança (arrumação e limpeza):</p><details class=\"faq\"><summary>A limpeza do quarto é feita todos os dias?</summary><div class=\"faq-a\"><p>Sim. A arrumação diária acontece entre 9h e 16h. Se não desejar a entrada da equipe, é só colocar a placa de \"Não Perturbe\" na porta.</p></div></details><details class=\"faq\"><summary>Posso solicitar troca de toalhas ou roupas de cama?</summary><div class=\"faq-a\"><p>Sim. Toalhas são trocadas diariamente ou sob solicitação; roupas de cama, em caso de necessidade ou mediante pedido.</p></div></details><details class=\"faq\"><summary>Posso agendar um horário específico para a limpeza?</summary><div class=\"faq-a\"><p>Sim. Informe na recepção ou pendure a placa \"Livre para Limpeza\". Faremos o possível, conforme a disponibilidade da equipe.</p></div></details><details class=\"faq\"><summary>Esqueci a placa \"Não Perturbe\" e entraram no quarto. E agora?</summary><div class=\"faq-a\"><p>Pedimos desculpas — nossa equipe sempre respeita a sinalização. Se acontecer, avise a recepção imediatamente para corrigirmos a falha.</p></div></details><details class=\"faq\"><summary>A governança lava ou passa roupas dos hóspedes?</summary><div class=\"faq-a\"><p>Não, esse serviço não é realizado pela governança. Em casos emergenciais há serviço de lavanderia — consulte a recepção.</p></div></details><details class=\"faq\"><summary>Esqueci um item no quarto. O que acontece?</summary><div class=\"faq-a\"><p>Itens esquecidos vão para a recepção e ficam guardados por até 45 dias. Entre em contato o quanto antes para recuperá-los.</p></div></details><details class=\"faq\"><summary>A governança repõe as amenidades?</summary><div class=\"faq-a\"><p>Sim, mediante solicitação.</p></div></details><details class=\"faq\"><summary>Posso pedir uma limpeza extra fora do horário?</summary><div class=\"faq-a\"><p>Sim, conforme a disponibilidade da equipe. Solicite na recepção.</p></div></details><h4>Informações importantes</h4><ul><li>Não é permitido pendurar roupas nas varandas.</li><li>É proibido fumar nas acomodações, varandas e corredores.</li><li>O enxoval (toalhas, roupas de cama etc.) é de uso exclusivo dos hóspedes — não pode ser usado para pets.</li><li>Danos causados ao enxoval ou à acomodação (inclusive por pets) serão cobrados.</li></ul>", "cat": "servicos"}, "toalhas": {"t": "Toalhas para Piscina", "e": "🏖️", "html": "<p>Hóspedes com pulseira <strong>roxa, branca, dourada ou amarela</strong> têm direito a 1 toalha gratuita por pessoa para uso nas piscinas. Para os demais, é cobrada uma taxa de <strong>R$ 15,00</strong> por toalha. 🏖️</p><h4>Retirada e devolução</h4><ul><li>Portaria do Parque Aquático</li><li>Centro de Vivências</li></ul><p class=\"obs\">A devolução pode ser feita em qualquer um dos dois locais.</p>", "cat": "servicos"}, "emprestimos": {"t": "Empréstimos", "e": "🤝", "html": "<p>Pensando no seu conforto, disponibilizamos itens para empréstimo durante a estada. 🤝</p><h4>Retirada na loja de conveniência</h4><div class=\"kvs\"><div class=\"kv\"><span>Transformador de energia</span><b>até 24h</b></div><div class=\"kv\"><span>Ferro de passar</span><b>até 1h</b></div></div><h4>Solicitados na recepção (entregues no quarto)</h4><ul><li>Varal de chão</li><li>Banheira para bebê</li><li>Grade de segurança para cama</li><li>Cadeira de banho</li><li>Ventilador</li></ul><h4>Outros itens</h4><ul><li><strong>Toalhas para piscina</strong> — retirada na portaria do Parque Aquático ou na lanchonete do Centro de Vivências (1 toalha por pessoa por dia).</li><li><strong>Micro-ondas</strong> — taxa única de R$ 100,00 por hospedagem (sócios cotistas são isentos).</li></ul><p class=\"obs\">Todos os itens estão sujeitos à disponibilidade.</p>", "cat": "servicos"}, "lavanderia": {"t": "Lavanderia", "e": "👕", "html": "<p>O resort não possui serviço de lavanderia regular para hóspedes — mas, em <strong>casos de emergência</strong>, oferecemos um atendimento especial. 👕</p><ul><li>As peças são cobradas por tamanho e unidade.</li><li>Valores e procedimentos: consulte a recepção.</li></ul>", "cat": "servicos"}, "primeiros-socorros": {"t": "Primeiros Socorros", "e": "⛑️", "html": "<p>Contamos com uma Sala de Primeiros Socorros com técnico de enfermagem para atendimentos iniciais e avaliações básicas. ⛑️</p><div class=\"kvs\"><div class=\"kv\"><span>Local</span><b>Parque Aquático</b></div><div class=\"kv\"><span>Plantão</span><b>8h às 18h</b></div></div><p>Casos que exigem maior atenção são encaminhados ao pronto-socorro mais próximo.</p><p class=\"obs\">Fora do horário de plantão, acione a recepção.</p>", "cat": "servicos"}, "achados-perdidos": {"t": "Achados e Perdidos", "e": "🔍", "html": "<p>Objetos esquecidos nas dependências do resort são encaminhados à recepção ou à loja de conveniência. 🔍</p><div class=\"kvs\"><div class=\"kv\"><span>Prazo de guarda</span><b>até 45 dias</b></div></div><p class=\"obs\">Após esse prazo, conforme nosso Manual de Conduta Hoteleira, os objetos não retirados são descartados.</p>", "cat": "servicos"}, "pet": {"t": "Pet Friendly", "e": "🐾", "html": "<p>Seu aumiguinho é muito bem-vindo! Pets podem se hospedar com você em chalés ou apartamentos, seguindo algumas regrinhas: 🐾</p><ul><li>Acesso liberado às áreas comuns, <strong>exceto</strong> áreas de alimentação e áreas molhadas (Parque Aquático e piscinas aquecidas).</li><li>Para a limpeza do quarto, o pet não deve estar na acomodação — agende a limpeza com a recepção.</li><li>Aceitamos pets de pequeno e médio porte.</li></ul><p class=\"obs\">Ficou com dúvidas? Nossa equipe está à disposição.</p>", "cat": "servicos"}, "spa": {"t": "Essence Spa", "e": "💆", "html": "<p>Além de toda a aventura, o China Park também oferece um espaço tranquilo e acolhedor para quem busca relaxar e se reconectar. A massagem é mais do que descanso: é um momento de cuidado com o próprio corpo. 💆</p><div class=\"kvs\"><div class=\"kv\"><span>Valor (qualquer massagem)</span><b>R$ 200,00</b></div></div><h4>Agendamento</h4><p>Na recepção do Spa — em frente ao Brinquedão ou no anexo ao lado do Restaurante dos Lagos — ou na recepção do resort.</p><p>Reserve um tempo só seu. Você merece esse cuidado!</p>", "cat": "servicos"}, "capela": {"t": "Capela Ecumênica", "e": "⛪", "html": "<p>O China Park Eco Resort disponibiliza uma capela ecumênica: um espaço de paz, reflexão e conexão espiritual, aberto para orações, rezas ou qualquer forma de expressão da sua fé. ⛪</p><div class=\"kvs\"><div class=\"kv\"><span>Culto especial</span><b>segundas-feiras, 19h</b></div></div><p>Sinta-se à vontade para visitar e aproveitar esse momento de serenidade.</p>", "cat": "servicos"}, "espacos": {"t": "Espaços do Resort", "e": "🗺️", "html": "\n<p>Os principais espaços do resort, para você se localizar:</p>\n<h4>Lazer e aventura</h4>\n<ul>\n<li><strong>Parque Aquático</strong> — piscinas (9h às 17h) e Hidroshow</li>\n<li><strong>Centro Termal</strong> — piscinas aquecidas cobertas</li>\n<li><strong>Teleférico</strong> — cartão-postal da região</li>\n<li><strong>Tirolesa e Arvorismo</strong> — circuito de aventura</li>\n<li><strong>Trilha Ecológica</strong> — ~40 min em meio à natureza</li>\n<li><strong>Lagos</strong> — pesca recreativa (pesque e solte) e pedalinhos</li>\n<li><strong>Casa de Campo</strong> — fazendinha e contato com animais</li>\n</ul>\n<h4>Esporte</h4>\n<ul>\n<li><strong>Quadra Coberta</strong> · <strong>Campo Society</strong> · <strong>Quadra de Tênis</strong> · <strong>Quadra de Beach Tennis</strong> · <strong>Academia</strong> (7h às 20h)</li>\n</ul>\n<h4>Crianças e família</h4>\n<ul>\n<li><strong>Brinquedão</strong> — parque coberto</li>\n<li><strong>Espaço Kids</strong> — recreação infantil</li>\n<li><strong>Praça Estação da Alegria</strong> — ponto de encontro e embarque do trenzinho</li>\n<li><strong>Cine-Chininha</strong> — sessões diárias</li>\n<li><strong>Copa Baby</strong> — aberta 24h</li>\n</ul>\n<h4>Gastronomia e convivência</h4>\n<ul>\n<li><strong>Centro Gourmet</strong> — Restaurante Gourmet (buffet) e refeições</li>\n<li><strong>Restaurante dos Lagos</strong> — self-service a quilo</li>\n<li><strong>Lanchonete do Centro de Vivências</strong> — lanches e delivery</li>\n<li><strong>Centro de Vivências</strong> — salão de jogos, sinuca e atividades noturnas</li>\n<li><strong>Empório Gava</strong> e <strong>Conveniência</strong></li>\n</ul>\n<h4>Serviços</h4>\n<ul>\n<li><strong>Recepção</strong> · <strong>Essence Spa</strong> · <strong>Sala de Primeiros Socorros</strong> · <strong>Capela Ecumênica</strong> · <strong>Lavanderia</strong></li>\n</ul>\n", "cat": "planeje"}}};
var G = JSON.parse(JSON.stringify(DEFAULT_G));
var dirty = false;
var cur = null; // {catId, slug|null(novo), isExt}

function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}
function setStatus(msg, isDirty){
  var el=document.getElementById('status');
  el.innerHTML=msg; el.className='status'+(isDirty?' dirty':'');
}
function markDirty(){ dirty=true; setStatus('<b>Alterações não publicadas.</b> Clique em Publicar para os hóspedes verem.', true); }

function renderLista(){
  var box=document.getElementById('lista');
  // preserva o que estava aberto (edições seguidas na mesma categoria)
  var abertas={};
  box.querySelectorAll('details.cat[open]').forEach(function(d){abertas[d.dataset.id]=true;});
  box.innerHTML='';
  G.cats.forEach(function(cat){
    var el=document.createElement('details'); el.className='cat'; el.dataset.id=cat.id;
    if(abertas[cat.id]) el.open=true;
    var rows=cat.items.map(function(it,idx){
      var tipo = it.ext ? 'LINK' : 'PÁGINA';
      return '<div class="item"><span class="em">'+esc(it.e)+'</span><span class="nm">'+esc(it.t)+'</span>'+
        '<span class="tp">'+tipo+'</span>'+
        '<button class="ed" onclick="abrirEditor(\''+cat.id+'\','+idx+')">Editar</button></div>';
    }).join('');
    el.innerHTML='<summary><h2>'+esc(cat.title)+'</h2><span class="qt">'+cat.items.length+' itens</span>'+
      '<span class="chev">▶</span></summary>'+
      '<div class="cat-body">'+rows+
      '<button class="add" onclick="novaPagina(\''+cat.id+'\')">+ Nova página em “'+esc(cat.title)+'”</button></div>';
    box.appendChild(el);
  });
}

function abrirEditor(catId, idx){
  var cat=G.cats.find(function(c){return c.id===catId;});
  var it=cat.items[idx];
  cur={catId:catId, idx:idx, slug:it.slug, isExt:!!it.ext, novo:false};
  document.getElementById('f-t').value=it.t;
  document.getElementById('f-e').value=it.e;
  document.getElementById('f-url-wrap').style.display = it.ext ? '' : 'none';
  document.getElementById('content-wrap').style.display = it.ext ? 'none' : '';
  document.getElementById('del').style.display = it.ext ? 'none' : '';
  if (it.ext) document.getElementById('f-url').value=it.ext;
  else document.getElementById('canvas').innerHTML=(G.pages[it.slug]||{}).html||'';
  document.body.classList.add('editing');
  window.scrollTo(0,0);
}

function novaPagina(catId){
  cur={catId:catId, idx:-1, slug:null, isExt:false, novo:true};
  document.getElementById('f-t').value='';
  document.getElementById('f-e').value='📄';
  document.getElementById('f-url-wrap').style.display='none';
  document.getElementById('content-wrap').style.display='';
  document.getElementById('del').style.display='none';
  document.getElementById('canvas').innerHTML='<p></p>';
  document.body.classList.add('editing');
  window.scrollTo(0,0);
}

function slugify(t){
  return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'pagina';
}

function aplicar(){
  var t=document.getElementById('f-t').value.trim();
  var e=document.getElementById('f-e').value.trim()||'📄';
  if(!t){alert('Dê um título.');return;}
  var cat=G.cats.find(function(c){return c.id===cur.catId;});
  if(cur.isExt){
    var url=document.getElementById('f-url').value.trim();
    if(!url){alert('Informe o endereço do link.');return;}
    var it=cat.items[cur.idx]; it.t=t; it.e=e; it.ext=url;
  } else {
    var slug=cur.slug;
    if(cur.novo){
      slug=slugify(t); var base=slug, n=2;
      while(G.pages[slug]){ slug=base+'-'+(n++); }
      cat.items.push({slug:slug,t:t,e:e});
    } else {
      var it2=cat.items[cur.idx]; it2.t=t; it2.e=e;
    }
    G.pages[slug]={t:t,e:e,html:document.getElementById('canvas').innerHTML,cat:cur.catId};
  }
  markDirty(); fecharEditor(); renderLista();
}

function excluir(){
  if(cur.isExt||cur.novo)return;
  if(!confirm('Excluir a página “'+document.getElementById('f-t').value+'” do guia?'))return;
  var cat=G.cats.find(function(c){return c.id===cur.catId;});
  cat.items.splice(cur.idx,1);
  delete G.pages[cur.slug];
  markDirty(); fecharEditor(); renderLista();
}

function fecharEditor(){ document.body.classList.remove('editing'); cur=null; }

function fmt(cmd,val){ document.getElementById('canvas').focus(); document.execCommand(cmd,false,val||null); }
function addLink(){
  var url=prompt('Endereço do link (https://…):');
  if(url) fmt('createLink',url);
}

function publicar(){
  var b=document.getElementById('pub');
  b.disabled=true; b.textContent='Publicando…';
  fetch('/api/recreacao-salvar',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({chave:'guia',dados:G})
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    dirty=false;
    setStatus('<b>Publicado!</b> Os hóspedes já veem esta versão.', false);
  }).catch(function(){
    alert('Não foi possível publicar. Verifique a internet e tente de novo.');
    setStatus('<b>Falha ao publicar.</b> Suas alterações continuam aqui — tente de novo.', true);
  }).finally(function(){ b.disabled=false; b.textContent='Publicar'; });
}

function restaurar(){
  if(!confirm('Voltar TODO o guia para o conteúdo padrão? As alterações publicadas continuam no ar até você publicar de novo.'))return;
  G=JSON.parse(JSON.stringify(DEFAULT_G));
  markDirty(); renderLista();
}

renderLista();
setStatus('Carregando versão publicada…', false);
fetch('/api/recreacao',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
  if(d && d.guia && d.guia.cats && d.guia.pages){
    G=d.guia; renderLista();
    setStatus('Editando a <b>versão publicada</b>. Alterações só valem depois de Publicar.', false);
  } else {
    setStatus('Ainda não há versão publicada — editando o <b>conteúdo padrão</b>.', false);
  }
}).catch(function(){
  setStatus('Sem conexão com o servidor — editando o conteúdo padrão.', false);
});
</script>
</body>
</html>
