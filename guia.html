<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>China Park · Guia do Hóspede</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --marinho:#2F3855; --coral:#FF4546; --verde:#57A68C; --ambar:#F7B846; --creme:#F3EEE8;
  --verde-txt:#2F8A6B; --ambar-txt:#B07D12; --coral-txt:#D93B3C;
  --ink:#2F3855; --muted:#6b7280;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Lexend',-apple-system,sans-serif;background:var(--creme);color:var(--ink);min-height:100vh}
a{text-decoration:none;color:inherit}
button{font-family:inherit}

.hd{background:var(--marinho);padding:22px 16px 26px;text-align:center;position:relative}
.hd::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(90deg,var(--coral) 0 25%,var(--ambar) 25% 50%,var(--verde) 50% 75%,var(--creme) 75%)}
.hd img{height:64px}
.hd .tagline{color:rgba(255,255,255,.85);font-size:.8rem;font-weight:300;margin-top:8px;letter-spacing:.06em}

.wrap{max-width:680px;margin:0 auto;padding:18px 14px 60px}
.hello{font-family:'Lora',serif;font-size:1.35rem;font-weight:600;color:var(--marinho);margin:10px 2px 2px}
.hello-sub{color:var(--muted);font-size:.85rem;font-weight:300;margin:0 2px 14px}
.search{width:100%;padding:13px 18px;border:2px solid rgba(47,56,85,.1);border-radius:99px;
  font-family:inherit;font-size:.9rem;background:#fff;outline:none;color:var(--ink)}
.search:focus{border-color:var(--ambar)}
.search::placeholder{color:#a9adbd}
.cat{margin-top:26px}
.cat h2{font-family:'Lora',serif;font-size:1.05rem;font-weight:600;color:var(--marinho);
  margin-bottom:12px;padding-left:10px;border-left:4px solid var(--ambar)}
.cat:nth-of-type(3n+1) h2{border-color:var(--coral)}
.cat:nth-of-type(3n+2) h2{border-color:var(--verde)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;background:#fff;border-radius:14px;padding:16px 8px 13px;text-align:center;
  box-shadow:0 1px 4px rgba(47,56,85,.07);border:1px solid rgba(47,56,85,.05);
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .12s ease, box-shadow .12s ease}
.tile:active{transform:scale(.94)}
@media(hover:hover){.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(47,56,85,.13)}}
.tile-ico{font-size:1.65rem;line-height:1;width:52px;height:52px;display:flex;align-items:center;justify-content:center;
  background:var(--creme);border-radius:50%}
.grid .tile:nth-child(4n+1) .tile-ico{background:#FDEBEB}
.grid .tile:nth-child(4n+2) .tile-ico{background:#EAF4F0}
.grid .tile:nth-child(4n+3) .tile-ico{background:#FDF3DD}
.tile-lbl{font-size:.72rem;font-weight:500;color:var(--marinho);line-height:1.25}
.tile-badge{position:absolute;top:8px;right:8px;background:var(--coral);color:#fff;font-size:.5rem;
  font-weight:700;letter-spacing:.05em;padding:3px 6px;border-radius:99px;animation:pulse 2s infinite}
/* cartão-destaque (ex.: Essence Spa): diferencial do resort */
.tile-dest{background:linear-gradient(150deg,var(--verde),#3F8A70);border:none;
  box-shadow:0 6px 18px rgba(87,166,140,.35)}
.tile-dest .tile-lbl{color:#fff}
.grid .tile-dest .tile-ico{background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tile-dest .tile-badge{background:var(--ambar);color:var(--marinho);animation:none}
@media(hover:hover){.tile-dest:hover{box-shadow:0 10px 24px rgba(87,166,140,.45)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.page{display:none}
body.viewing .home{display:none}
body.viewing .page{display:block;animation:slideUp .28s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pg-top{display:flex;align-items:center;gap:12px;margin:14px 2px 14px}
.back{background:#fff;border:1px solid rgba(47,56,85,.12);color:var(--marinho);border-radius:99px;
  padding:8px 16px;font-size:.8rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pg-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(47,56,85,.08)}
.pg-hero{padding:26px 20px 20px;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
.pg-hero.c-hoje{background:linear-gradient(135deg,#FDEBEB,#FDF3DD)}
.pg-hero.c-atividades{background:linear-gradient(135deg,#EAF4F0,#FDF3DD)}
.pg-hero.c-aventuras{background:linear-gradient(135deg,#FDF3DD,#FDEBEB)}
.pg-hero.c-comer{background:linear-gradient(135deg,#FDEBEB,#EAF4F0)}
.pg-hero.c-servicos{background:linear-gradient(135deg,#EAF4F0,#E9ECF5)}
.pg-hero.c-planeje{background:linear-gradient(135deg,#E9ECF5,#FDF3DD)}
.pg-hero .em{font-size:2.3rem;width:66px;height:66px;background:#fff;border-radius:20px;
  display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(47,56,85,.12);
  animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.pg-hero h1{font-family:'Lora',serif;font-size:1.4rem;font-weight:600;color:var(--marinho);line-height:1.2}
.pg-body{padding:20px 20px 26px;font-size:.9rem;font-weight:300;line-height:1.75;color:#3d4358}
.pg-body p{margin-bottom:12px}
.pg-body h4{font-family:'Lora',serif;font-weight:600;font-size:1.02rem;color:var(--marinho);margin:22px 0 10px;
  padding-left:9px;border-left:3px solid var(--ambar)}
.pg-body ul,.pg-body ol{margin:0 0 12px 20px}
.pg-body li{margin-bottom:5px}
.pg-body strong{font-weight:600;color:var(--marinho)}
.pg-body a{color:var(--verde-txt);font-weight:500;text-decoration:underline}
.pg-body a.cta{display:inline-block;background:var(--marinho);color:#fff;text-decoration:none;font-weight:600;
  font-size:.85rem;padding:12px 22px;border-radius:99px;margin-top:6px;transition:transform .12s}
.pg-body a.cta:active{transform:scale(.96)}
.kvs{background:var(--creme);border-radius:14px;padding:6px 14px;margin:10px 0 16px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;
  border-bottom:1px dashed rgba(47,56,85,.14)}
.kvs .kv:last-child{border-bottom:none}
.kv span{font-weight:400;font-size:.83rem}
.kv b{font-weight:600;color:var(--verde-txt);font-size:.85rem;text-align:right}
.pg-body > .kv{background:var(--creme);border-radius:12px;padding:10px 14px;margin:8px 0;border-bottom:none}
.faq{border:1px solid rgba(47,56,85,.1);border-radius:12px;margin:0 0 10px;overflow:hidden;background:#fff}
.faq summary{list-style:none;cursor:pointer;padding:13px 40px 13px 14px;font-weight:500;font-size:.85rem;
  color:var(--marinho);position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';position:absolute;right:14px;top:50%;transform:translateY(-50%);
  font-size:1.2rem;color:var(--ambar-txt);transition:transform .2s}
.faq[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.faq[open] summary{background:var(--creme)}
.faq-a{padding:12px 14px 4px}
.pg-body table{width:100%;border-collapse:collapse;margin:6px 0 14px}
.pg-body table.menu td{padding:9px 6px;border-bottom:1px solid var(--creme);vertical-align:top}
.pg-body .mprice{white-space:nowrap;text-align:right;font-weight:600;color:var(--verde-txt)}
.pg-body .mdesc{font-size:.78rem;color:var(--muted);margin-top:2px}
.pg-body .obs{font-size:.75rem;color:var(--muted);font-style:italic}
.related{margin-top:22px}
.related h3{font-family:'Lora',serif;font-size:.98rem;color:var(--marinho);margin-bottom:10px}
.rel-row{display:flex;gap:8px;flex-wrap:wrap}
.rel-chip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid rgba(47,56,85,.12);
  border-radius:99px;padding:8px 14px;font-size:.76rem;font-weight:500;color:var(--marinho);
  transition:transform .12s}
.rel-chip:active{transform:scale(.95)}
.ft{text-align:center;color:var(--muted);font-size:.72rem;font-weight:300;margin-top:40px}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="hd">
  <a href="#/"><img src="logo-chinapark-white.png" alt="China Park Eco Resort"></a>
  <div class="tagline">GUIA DO HÓSPEDE</div>
</header>

<main class="wrap">
  <div class="home">
    <h1 class="hello">Bem-vindo! 🌿</h1>
    <p class="hello-sub">Tudo o que você precisa durante a sua estadia, na palma da mão.</p>
    <input class="search" id="search" type="search" placeholder="🔍 Buscar no guia… (ex.: piscina, pizza, spa)">
    <div id="cats"></div>
    <p class="ft">China Park Eco Resort · Domingos Martins/ES<br>
    Dúvidas? A recepção está sempre à disposição.</p>
  </div>

  <div class="page">
    <div class="pg-top"><button class="back" onclick="history.length>1?history.back():location.hash='#/'">← Voltar</button></div>
    <article class="pg-card">
      <div class="pg-hero" id="pg-hero"><div class="em" id="pg-em"></div><h1 id="pg-title"></h1></div>
      <div class="pg-body" id="pg-body"></div>
    </article>
    <div class="related" id="related"></div>
  </div>
</main>

<script>
// Conteúdo padrão embutido (primeiro quadro + fallback offline).
// A versão publicada pela equipe no guia-admin chega via /api/recreacao (chave 'guia') e substitui.
var G = {"cats": [{"id": "hoje", "title": "Hoje no China Park", "items": [{"slug": "programacao", "t": "Programação da Recreação", "e": "🎉", "badge": "AO VIVO", "ext": "recreacao.html"}, {"slug": "cinema-sessoes", "t": "Cinema — Sessões", "e": "🎬", "ext": "cinema.html"}, {"slug": "musica", "t": "Música ao Vivo", "e": "🎸", "ext": "musica.html"}]}, {"id": "atividades", "title": "Atividades inclusas", "items": [{"slug": "teleferico", "t": "Teleférico", "e": "🚡"}, {"slug": "trenzinho", "t": "Trenzinho", "e": "🚂"}, {"slug": "brinquedao", "t": "Brinquedão", "e": "🎠"}, {"slug": "parque-aquatico", "t": "Parque Aquático", "e": "🏊"}, {"slug": "centro-termal", "t": "Centro Termal", "e": "♨️"}, {"slug": "cinema", "t": "Cine-Chininha", "e": "🍿"}, {"slug": "casa-de-campo", "t": "Casa de Campo", "e": "🏡"}, {"slug": "lagos-pesca", "t": "Lagos para Pesca", "e": "🎣"}, {"slug": "pedalinhos", "t": "Pedalinhos", "e": "🚣"}, {"slug": "trilha", "t": "Trilha Ecológica", "e": "🥾"}, {"slug": "academia", "t": "Academia", "e": "🏋️"}, {"slug": "quadra-coberta", "t": "Quadra Coberta", "e": "🏀"}, {"slug": "salao-jogos", "t": "Salão de Jogos", "e": "🎱"}, {"slug": "campo-society", "t": "Campo Society", "e": "⚽"}, {"slug": "quadra-tenis", "t": "Quadra de Tênis", "e": "🎾"}, {"slug": "beach-tennis", "t": "Beach Tennis", "e": "🏐"}]}, {"id": "aventuras", "title": "Aventuras (à parte)", "items": [{"slug": "tirolesa", "t": "Tirolesa", "e": "🪂"}, {"slug": "arvorismo", "t": "Arvorismo", "e": "🌳"}, {"slug": "vara-pesca", "t": "Aluguel de Vara de Pesca", "e": "🪝"}]}, {"id": "comer", "title": "Comer & Beber", "items": [{"slug": "restaurante-gourmet", "t": "Centro Gourmet", "e": "🍽️"}, {"slug": "restaurante-lagos", "t": "Restaurante dos Lagos", "e": "🥗"}, {"slug": "servicos-alimentacao", "t": "Serviços de Alimentação", "e": "🍴"}, {"slug": "cardapio-lanchonete", "t": "Cardápio da Lanchonete", "e": "🍔"}, {"slug": "cardapio-bebidas", "t": "Cardápio de Bebidas", "e": "🍹"}, {"slug": "copa-baby", "t": "Copa Baby (24h)", "e": "🍼"}, {"slug": "emporio", "t": "Empório Gava", "e": "🛒"}, {"slug": "conveniencia", "t": "Conveniência", "e": "🏪"}]}, {"id": "servicos", "title": "Serviços & Informações", "items": [{"slug": "informacoes", "t": "Informações Gerais", "e": "ℹ️"}, {"slug": "checkout", "t": "Check-out", "e": "🧳"}, {"slug": "servico-quarto", "t": "Serviço de Quarto", "e": "🛏️"}, {"slug": "toalhas", "t": "Toalhas para Piscina", "e": "🏖️"}, {"slug": "emprestimos", "t": "Empréstimos", "e": "🤝"}, {"slug": "lavanderia", "t": "Lavanderia", "e": "👕"}, {"slug": "primeiros-socorros", "t": "Primeiros Socorros", "e": "⛑️"}, {"slug": "achados-perdidos", "t": "Achados e Perdidos", "e": "🔍"}, {"slug": "pet", "t": "Pet Friendly", "e": "🐾"}, {"slug": "spa", "t": "Essence Spa", "e": "💆", "dest": 1}, {"slug": "capela", "t": "Capela Ecumênica", "e": "⛪"}]}, {"id": "planeje", "title": "Planeje-se", "items": [{"slug": "espacos", "t": "Espaços do Resort", "e": "🗺️"}, {"slug": "regiao", "t": "Região das Montanhas", "e": "🏔️", "ext": "https://view.publitas.com/deolhonarua/click-nas-montanhas/page/1"}, {"slug": "cotacao", "t": "Cotação e Reservas", "e": "📅", "ext": "https://book.omnibees.com/hotelresults?q=10771"}, {"slug": "avalie", "t": "Avalie-nos", "e": "⭐", "ext": "https://e-qr.codes/fdcfb20875"}]}], "pages": {"teleferico": {"t": "Teleférico", "e": "🚡", "html": "<p>O teleférico do China Park é uma das principais atrações do resort e um verdadeiro cartão-postal da região. Primeiro e único teleférico do Espírito Santo, há mais de 20 anos proporciona uma vista privilegiada da natureza local.</p><h4>Horário de funcionamento</h4><div class=\"kvs\"><div class=\"kv\"><span>Segunda e quinta</span><b>11h–12h e 15h–16h</b></div><div class=\"kv\"><span>Terça e quarta</span><b>11h–12h</b></div><div class=\"kv\"><span>Sexta</span><b>manutenção preventiva</b></div><div class=\"kv\"><span>Sábado e domingo</span><b>9h30–12h e 14h–17h</b></div></div><h4>Meses de férias (janeiro, julho e dezembro)</h4><div class=\"kvs\"><div class=\"kv\"><span>Segunda a sexta</span><b>10h30–12h e 15h–17h</b></div><div class=\"kv\"><span>Sábado e domingo</span><b>9h30–12h e 14h–17h</b></div></div><p class=\"obs\">Em julho, o horário de férias vale de 10/07 a 26/07. O funcionamento do teleférico e da tirolesa pode sofrer alterações sem aviso prévio por condições meteorológicas ou imprevistos operacionais, sempre visando a segurança de todos.</p>", "cat": "atividades"}, "trenzinho": {"t": "Trenzinho", "e": "🚂", "html": "<p>Piuí! Piuíí! 🚂 Embarque nessa aventura com nossos recreadores no trem mais animado das montanhas capixabas!</p><h4>Como embarcar</h4><ul><li>É <strong>obrigatório retirar a ficha de embarque</strong>, em frente ao Brinquedão.</li><li>As fichas da manhã são distribuídas 10 minutos antes do primeiro embarque do dia.</li><li>Para o último passeio do dia, a distribuição acontece 10 minutos antes do embarque da tarde.</li></ul><h4>Horários de saída</h4><div class=\"kvs\"><div class=\"kv\"><span>Sábado a segunda</span><b>a partir das 9h10 e das 15h30</b></div><div class=\"kv\"><span>Terça a sexta</span><b>a partir das 9h40 e das 15h30</b></div><div class=\"kv\"><span>Férias (jan, jul e dez)</span><b>todos os dias, 9h10 e 15h30</b></div></div><p class=\"obs\">Em julho, o horário de férias vale de 11/07 a 26/07.</p><h4>Bom saber</h4><ul><li>O passeio dura cerca de <strong>40 minutos</strong>.</li><li>Prefere ir sem o trenzinho? Deixe o carro na entrada da estrada da Casa de Campo e siga a pé — a entrada de veículos não é permitida por causa dos bichinhos.</li><li>Os animais ficam soltos para interação apenas durante os horários do trenzinho.</li></ul>", "cat": "atividades"}, "brinquedao": {"t": "Brinquedão", "e": "🎠", "html": "<h4>Horário de funcionamento</h4><div class=\"kvs\"><div class=\"kv\"><span>Domingo a quarta</span><b>9h às 21h</b></div><div class=\"kv\"><span>Quinta-feira</span><b>10h às 21h</b></div><div class=\"kv\"><span>Sexta-feira</span><b>12h às 22h</b></div><div class=\"kv\"><span>Sábado</span><b>9h às 22h</b></div><div class=\"kv\"><span>Férias (jan, jul e dez)</span><b>todos os dias, 9h às 22h</b></div></div><p class=\"obs\">Em julho, o horário de férias vale de 10/07 a 26/07.</p><p>Crianças que ainda dependem de ajuda para trocar fraldas ou ir ao banheiro devem estar sempre acompanhadas de um responsável.</p><p><a class=\"cta\" href=\"cadastro-recreacao\">Fazer o cadastro das crianças →</a></p>", "cat": "atividades"}, "parque-aquatico": {"t": "Parque Aquático", "e": "🏊", "html": "<h4>Horários</h4><div class=\"kvs\"><div class=\"kv\"><span>Piscinas</span><b>9h às 17h (todos os dias)</b></div><div class=\"kv\"><span>Toboáguas e cascata</span><b>10h às 17h</b></div></div><h4>Estrutura</h4><ul><li>4 piscinas (adultas e infantis)</li><li>2 toboáguas</li><li>1 cascata artificial</li></ul><h4>Altura mínima por piscina</h4><p>Para a segurança de todos, cada piscina tem altura mínima obrigatória — mesmo acompanhadas de um responsável, crianças abaixo da altura exigida não podem entrar.</p><div class=\"kvs\"><div class=\"kv\"><span>1ª piscina</span><b>mínimo 140 cm</b></div><div class=\"kv\"><span>2ª piscina</span><b>mínimo 120 cm</b></div><div class=\"kv\"><span>3ª piscina</span><b>mínimo 90 cm</b></div><div class=\"kv\"><span>4ª piscina (infantil)</span><b>sem restrição</b></div></div><p>Agradecemos a compreensão e desejamos momentos de lazer com segurança! 💦</p>", "cat": "atividades"}, "centro-termal": {"t": "Centro Termal", "e": "♨️", "html": "<p>Piscinas aquecidas, ofurôs e sauna: nada melhor do que fechar o dia em águas quentinhas aproveitando o friozinho das montanhas capixabas!</p><h4>Horário de funcionamento</h4><div class=\"kvs\"><div class=\"kv\"><span>Segunda, terça e quinta</span><b>11h às 21h</b></div><div class=\"kv\"><span>Quarta</span><b>14h às 21h</b></div><div class=\"kv\"><span>Sexta e sábado</span><b>10h às 22h</b></div><div class=\"kv\"><span>Domingo</span><b>10h às 21h</b></div><div class=\"kv\"><span>Sauna</span><b>17h às 20h</b></div><div class=\"kv\"><span>Férias (jan, jul e dez)</span><b>todos os dias, 10h às 22h</b></div></div><h4>Estrutura</h4><ul><li><strong>20 ofurôs</strong> — um para cada família</li><li>Duas piscinas com 1,30 m e uma com 1,10 m de profundidade</li><li>Água aquecida a <strong>32 °C</strong>, temperatura ideal para relaxar</li></ul>", "cat": "atividades"}, "cinema": {"t": "Cine-Chininha", "e": "🍿", "html": "<p>A aventura por aqui vai além da vida real — ela também ganha vida na tela do nosso <strong>Cine-Chininha</strong>! Com capacidade para 36 pessoas, o cinema tem sessões diárias com filmes que conquistaram o público no mundo inteiro.</p><p>Os horários e os filmes em cartaz são atualizados diariamente. Ah, e não se esqueça de conferir a classificação indicativa antes da sessão, combinado?</p><p>Prepare a pipoca… a próxima exibição está prestes a começar! 🍿</p><p><a class=\"cta\" href=\"cinema.html\">Ver sessões da semana →</a></p>", "cat": "atividades"}, "casa-de-campo": {"t": "Casa de Campo", "e": "🏡", "html": "<p>Nossa Casa de Campo é um cantinho especial cheio de vida! Por aqui, você e sua família podem interagir com porquinhos-da-índia, coelhos, galinhas, pássaros… e até um avestruz! 🦚</p><p>É o passeio ideal para desacelerar, respirar ar puro e viver momentos inesquecíveis longe da rotina da cidade grande.</p><div class=\"kvs\"><div class=\"kv\"><span>Duração do passeio</span><b>cerca de 40 minutos</b></div></div><h4>Como chegar</h4><ul><li>De <strong>trenzinho</strong> (consulte os horários na página do Trenzinho).</li><li>Por conta própria: deixe o carro na entrada da estrada da Casa de Campo e siga a pé. Por segurança e respeito aos animais, veículos não entram.</li></ul><p class=\"obs\">A interação com os animais acontece apenas nos horários em que o trenzinho está em funcionamento — fora deles, os bichinhos não ficam soltos.</p>", "cat": "atividades"}, "lagos-pesca": {"t": "Lagos para Pesca", "e": "🎣", "html": "<p>A pesca recreativa (<strong>pesque e solte</strong>) é permitida em todos os lagos do resort. 🎣</p><p>Não trouxe sua vara? Alugamos um kit com 1 vara de pesca + 1 potinho de ração.</p><div class=\"kvs\"><div class=\"kv\"><span>Valor do kit</span><b>R$ 10,00</b></div></div><p class=\"obs\">Ao final do dia, devolva a vara no mesmo local da retirada. Aproveite esse momento de tranquilidade em meio à natureza!</p>", "cat": "atividades"}, "pedalinhos": {"t": "Pedalinhos", "e": "🚣", "html": "<p>Um passeio gostoso e repleto de natureza para a família! Cada pedalinho comporta até 2 adultos e 1 criança de colo. 🚣</p><div class=\"kvs\"><div class=\"kv\"><span>Horário de funcionamento</span><b>9h às 16h30</b></div></div><h4>Atenção</h4><ul><li>É obrigatório o uso de colete salva-vidas.</li><li>Crianças só podem usar o pedalinho acompanhadas dos pais ou de um responsável.</li></ul>", "cat": "atividades"}, "trilha": {"t": "Trilha Ecológica", "e": "🥾", "html": "<p>Explore nossa trilha em meio à natureza: são cerca de <strong>4 km</strong> de percurso, repletos de beleza e momentos de superação! 🥾</p><h4>Duas formas de aproveitar</h4><ul><li><strong>Com a equipe de Recreação</strong> — confira dia e horário no quadro de avisos em frente à antiga recepção (perto da loja de conveniência).</li><li><strong>Por conta própria</strong>, durante o dia.</li></ul><p>Na trilha, desafiamos o corpo e alimentamos a alma. Cada passo é uma chance de se reconectar com a natureza. Prepare-se para uma experiência transformadora!</p>", "cat": "atividades"}, "academia": {"t": "Academia", "e": "🏋️", "html": "<div class=\"kvs\"><div class=\"kv\"><span>Funcionamento</span><b>todos os dias, 7h às 20h</b></div></div><h4>Como acessar</h4><ul><li>Abra a chave de acesso pelo botão abaixo.</li><li>Aproxime o QR Code do leitor na porta da academia.</li><li>O acesso é liberado automaticamente.</li></ul><p><a class=\"cta\" href=\"https://drive.google.com/file/d/1ZF80zFVW8O35KfkJiWFzCuFjlCqcKF79/view?usp=sharing\" target=\"_blank\" rel=\"noopener\">Abrir chave de acesso (QR Code) →</a></p><p class=\"obs\">Em caso de dúvidas, nossa equipe está à disposição para ajudar.</p>", "cat": "atividades"}, "quadra-coberta": {"t": "Quadra Coberta", "e": "🏀", "html": "<p>Disponibilizamos uma quadra coberta para lazer e prática esportiva, faça chuva ou faça sol. 🏀</p><h4>Itens para empréstimo</h4><ul><li>Rede</li><li>Bola de futsal</li><li>Bola de vôlei</li></ul><p>Solicite os materiais na loja de conveniência (sujeitos à disponibilidade).</p><p class=\"obs\">Antes de usar a quadra, verifique se não há atividades da Recreação marcadas para o horário.</p>", "cat": "atividades"}, "salao-jogos": {"t": "Salão de Jogos", "e": "🎱", "html": "<p>Diversão garantida, faça chuva ou sol! O Salão de Jogos fica à disposição de todos os hóspedes, em família ou entre amigos. 🎱</p><h4>O que você encontra por lá</h4><ul><li>Totó (pebolim)</li><li>Ping-pong / tênis de mesa</li><li>Sinuca</li><li>Jogos de tabuleiro e cartas (Uno e outros, para empréstimo na loja de conveniência)</li><li>Jogos eletrônicos terceirizados (máquina de bichinhos, basquete eletrônico e outros)</li></ul><div class=\"kvs\"><div class=\"kv\"><span>Horário</span><b>todos os dias, 10h às 22h</b></div></div><p class=\"obs\">Acompanha o horário do Centro de Vivências. Divirta-se com respeito aos demais hóspedes!</p>", "cat": "atividades"}, "campo-society": {"t": "Campo Society", "e": "⚽", "html": "<p>Nosso campo society de grama sintética fica à disposição dos hóspedes em qualquer horário para momentos de lazer e esporte. ⚽</p><ul><li>Bola disponível para empréstimo na loja de conveniência (sujeita à disponibilidade).</li><li>Na retirada, um valor de <strong>caução</strong> é lançado na pulseira (tag) e estornado na devolução do item.</li></ul><p class=\"obs\">Antes de usar o campo, confirme com a equipe se não há programação da Recreação para o horário.</p>", "cat": "atividades"}, "quadra-tenis": {"t": "Quadra de Tênis", "e": "🎾", "html": "<p>A quadra de tênis fica à disposição dos hóspedes durante todo o dia. 🎾</p><p class=\"obs\">A quadra não possui refletores, por isso o uso é restrito ao período diurno. No momento não temos raquetes e bolinhas para empréstimo — traga seus próprios itens.</p>", "cat": "atividades"}, "beach-tennis": {"t": "Beach Tennis", "e": "🏐", "html": "<p>A quadra de beach tennis fica à disposição dos hóspedes durante todo o dia. 🏐</p><p>Raquetes e bolinhas estão disponíveis para empréstimo na loja de conveniência — basta solicitar e verificar a disponibilidade.</p><p class=\"obs\">A quadra não possui refletores, por isso o uso é restrito ao período diurno. Aproveite para praticar seu saque e se divertir ao ar livre!</p>", "cat": "atividades"}, "tirolesa": {"t": "Tirolesa", "e": "🪂", "html": "<p>Com <strong>107 metros de altura</strong> e <strong>669 metros de extensão</strong>, nossa tirolesa é a maior do Espírito Santo e a terceira maior do Brasil! Ao saltar da plataforma, você cruza o resort de ponta a ponta com uma vista aérea espetacular. 🪂</p><div class=\"kvs\"><div class=\"kv\"><span>Velocidade</span><b>até 65 km/h</b></div><div class=\"kv\"><span>Duração do trajeto</span><b>cerca de 1 minuto</b></div><div class=\"kv\"><span>Modalidade</span><b>individual ou em dupla</b></div></div><p class=\"obs\">Atividade realizada conforme as normas da ABNT.</p><h4>Requisitos para participar</h4><ul><li>Peso entre 40 kg e 120 kg</li><li>Altura mínima de 1,30 m</li><li>Idade mínima de 7 anos</li></ul><h4>Horário de funcionamento</h4><div class=\"kvs\"><div class=\"kv\"><span>Segunda e quinta</span><b>11h–12h e 15h–16h</b></div><div class=\"kv\"><span>Terça e quarta</span><b>11h–12h</b></div><div class=\"kv\"><span>Sexta</span><b>fechada para manutenção</b></div><div class=\"kv\"><span>Sábado e domingo</span><b>10h–12h e 14h–17h</b></div></div><h4>Meses de férias (janeiro, julho e dezembro)</h4><div class=\"kvs\"><div class=\"kv\"><span>Segunda a sexta</span><b>10h30–12h e 15h–17h</b></div><div class=\"kv\"><span>Sábado e domingo</span><b>9h30–12h e 14h–17h</b></div></div><p class=\"obs\">Em julho, o horário de férias vale de 11/07 a 26/07. Atividade à parte — consulte os valores no local. Horários podem mudar sem aviso prévio por condições climáticas, sempre pela segurança de todos.</p>", "cat": "aventuras"}, "arvorismo": {"t": "Arvorismo", "e": "🌳", "html": "<p>Adrenalina e diversão nas alturas! Nosso circuito de aventura fica na área central do resort: são <strong>16 obstáculos suspensos a 8 metros</strong> de altura, num percurso de 200 metros com pontes, teias, escadas e muito mais. 🌳</p><p>No final, a emoção chega ao auge com uma <strong>tirolesa de 180 metros</strong> que cruza um lago — inesquecível!</p><h4>Informações</h4><div class=\"kvs\"><div class=\"kv\"><span>Altura mínima</span><b>1,30 m</b></div><div class=\"kv\"><span>Peso máximo</span><b>120 kg</b></div><div class=\"kv\"><span>Duração média</span><b>30 a 60 minutos</b></div><div class=\"kv\"><span>Capacidade</span><b>até 20 pessoas por grupo</b></div></div><p class=\"obs\">Sempre acompanhado por condutor especializado.</p><h4>Horários</h4><div class=\"kvs\"><div class=\"kv\"><span>Segunda e quinta</span><b>9h e 10h · 13h30 e 14h30</b></div><div class=\"kv\"><span>Terça e quarta</span><b>9h e 10h · 13h45, 15h e 16h15</b></div><div class=\"kv\"><span>Sexta</span><b>fechado para manutenção</b></div><div class=\"kv\"><span>Sábado e domingo</span><b>9h, 10h15 e 11h30 · 13h45, 15h e 16h15</b></div><div class=\"kv\"><span>Férias (jan, jul e dez)</span><b>todos os dias, 9h, 10h15 e 11h30 · 13h45, 15h e 16h15</b></div></div><p class=\"obs\">Em julho, o horário de férias vale de 11/07 a 26/07. Atividade à parte — consulte os valores no local.</p><p>Pronto para encarar esse desafio nas alturas?</p>", "cat": "aventuras"}, "vara-pesca": {"t": "Aluguel de Vara de Pesca", "e": "🪝", "html": "<p>Esqueceu de trazer sua vara de pesca? Sem problemas! Alugamos um kit com <strong>vara + potinho de ração</strong> para garantir sua diversão no lago. 🎣</p><div class=\"kvs\"><div class=\"kv\"><span>Valor do kit</span><b>R$ 10,00</b></div><div class=\"kv\"><span>Retirada e devolução</span><b>setor de terceirizados</b></div></div><p class=\"obs\">Devolva a vara até o fim da tarde, no mesmo local da retirada. Boa pescaria!</p>", "cat": "aventuras"}, "restaurante-gourmet": {"t": "Centro Gourmet", "e": "🍽️", "html": "<p>O <strong>Centro Gourmet</strong> é o nosso principal restaurante — é lá que servimos as quatro refeições diárias: café da manhã, almoço, café da tarde e jantar. 🍽️</p><h4>Segunda a quinta</h4><div class=\"kvs\"><div class=\"kv\"><span>Café da manhã</span><b>7h30 às 10h</b></div><div class=\"kv\"><span>Almoço</span><b>12h às 13h30</b></div><div class=\"kv\"><span>Café da tarde</span><b>16h às 18h</b></div><div class=\"kv\"><span>Jantar</span><b>19h30 às 21h</b></div></div><h4>Sexta, sábado e domingo</h4><div class=\"kvs\"><div class=\"kv\"><span>Café da manhã</span><b>7h30 às 10h</b></div><div class=\"kv\"><span>Almoço</span><b>12h às 14h</b></div><div class=\"kv\"><span>Café da tarde</span><b>16h às 18h</b></div><div class=\"kv\"><span>Jantar</span><b>19h30 às 21h30</b></div></div><h4>Meses de férias (janeiro, julho e dezembro)</h4><div class=\"kvs\"><div class=\"kv\"><span>Café da manhã</span><b>7h30 às 10h</b></div><div class=\"kv\"><span>Almoço</span><b>12h às 14h</b></div><div class=\"kv\"><span>Café da tarde</span><b>16h às 18h</b></div><div class=\"kv\"><span>Jantar</span><b>19h30 às 21h30</b></div></div><p class=\"obs\">Em julho, o horário de férias vale de 10/07 a 26/07. Bebidas não alcoólicas (sucos, água e refrigerantes) e sobremesas estão inclusas.</p>", "cat": "comer"}, "restaurante-lagos": {"t": "Restaurante dos Lagos", "e": "🥗", "html": "<p>O <strong>Restaurante dos Lagos</strong> opera no sistema self-service a quilo, todos os dias. 🥗</p><p>É a opção ideal para hóspedes sem refeições inclusas na hospedagem — e para visitantes do day use.</p><p class=\"obs\">Consulte os horários do dia na recepção.</p>", "cat": "comer"}, "servicos-alimentacao": {"t": "Serviços de Alimentação", "e": "🍴", "html": "<h4>Cafeteria ☕</h4><p>Um espaço especial ao lado da recepção para desfrutar sabores únicos.</p><div class=\"kvs\"><div class=\"kv\"><span>Todos os dias</span><b>9h às 19h</b></div></div><h4>Lanchonete do Centro de Vivências 🍔</h4><p>Lanches, pizzas, porções e açaí — veja o <a href=\"#/cardapio-lanchonete\">cardápio completo aqui</a>.</p><div class=\"kvs\"><div class=\"kv\"><span>Domingo a quinta</span><b>10h às 21h</b></div><div class=\"kv\"><span>Sexta e sábado</span><b>10h às 22h</b></div><div class=\"kv\"><span>Férias (10/07 a 26/07)</span><b>todos os dias, 10h às 22h</b></div></div><p class=\"obs\">Delivery no quarto: consulte os dias disponíveis pelo ramal 211.</p><h4>Quiosques 🌴</h4><p>Quiosques no Parque Aquático, na fazendinha (Casa de Campo) e no Mirante. Funcionam acompanhando o horário das atividades de cada área.</p>", "cat": "comer"}, "cardapio-lanchonete": {"t": "Cardápio da Lanchonete", "e": "🍔", "html": "<h4>Hambúrgueres gourmet</h4><table class=\"menu\"><tr><td>Royal Burguer<div class=\"mdesc\">Pão bola, molho barbecue caseiro, 180 g de hambúrguer, bacon crocante, queijo muçarela e cebola grape</div></td><td class=\"mprice\">R$ 47</td></tr><tr><td>Classic Burguer<div class=\"mdesc\">Pão bola, molho da casa, 180 g de hambúrguer, cheddar, bacon crocante, alface e tomate</div></td><td class=\"mprice\">R$ 47</td></tr><tr><td>Secrets Burguer<div class=\"mdesc\">Pão bola, molho rosé, 180 g de hambúrguer, muçarela, cebola grape, bacon crocante e salada</div></td><td class=\"mprice\">R$ 47</td></tr><tr><td>Cheese Burguer<div class=\"mdesc\">Pão bola, 180 g de hambúrguer, molho da chef, queijo muçarela, alface e tomate</div></td><td class=\"mprice\">R$ 47</td></tr><tr><td>Chicken Burguer<div class=\"mdesc\">Pão bola, molho da chef, 180 g de hambúrguer de frango, picles, blend de cheddar e catupiry, alface e tomate</div></td><td class=\"mprice\">R$ 42</td></tr></table><h4>Hambúrgueres tradicionais</h4><table class=\"menu\"><tr><td>China Burguer<div class=\"mdesc\">Pão bola, hambúrguer, queijo derretido, folhas, tomatinho fatiado e batata palha</div></td><td class=\"mprice\">R$ 27</td></tr><tr><td>China Bacon<div class=\"mdesc\">Pão bola, hambúrguer, bacon crocante, queijo derretido, folhas, tomatinho fatiado e batata palha</div></td><td class=\"mprice\">R$ 29</td></tr><tr><td>China Egg<div class=\"mdesc\">Pão bola, hambúrguer, queijo derretido, ovo, folhas, tomatinho fatiado e batata</div></td><td class=\"mprice\">R$ 27</td></tr><tr><td>China Egg Bacon<div class=\"mdesc\">Pão bola, hambúrguer, bacon crocante, ovo, folhas, tomatinho fatiado e batata palha</div></td><td class=\"mprice\">R$ 30</td></tr><tr><td>China Tudo<div class=\"mdesc\">Pão bola, hambúrguer, bacon crocante, queijo derretido, presunto, 2 ovos, folhas, tomatinho fatiado e batata palha</div></td><td class=\"mprice\">R$ 34</td></tr><tr><td>Misto Quente<div class=\"mdesc\">Pão de forma triplo, 2 fatias de queijo muçarela, 2 fatias de presunto</div></td><td class=\"mprice\">R$ 27</td></tr><tr><td>Queijo Quente<div class=\"mdesc\">Pão de forma triplo, 2 fatias de queijo muçarela</div></td><td class=\"mprice\">R$ 20</td></tr></table><h4>Petiscos</h4><table class=\"menu\"><tr><td>Mignon ao Gorgonzola<div class=\"mdesc\">Filezinho bovino em cubos salteados em azeite, mergulhados no molho gorgonzola</div></td><td class=\"mprice\">R$ 90</td></tr><tr><td>Mignon<div class=\"mdesc\">Filezinho bovino em cubos salteados em azeite ao molho de vinho tinto e tirinhas de cebola</div></td><td class=\"mprice\">R$ 86</td></tr><tr><td>Franguito (frango e queijo)<div class=\"mdesc\">Filezinho de frango em tiras e cubos de queijo minas empanados</div></td><td class=\"mprice\">R$ 69</td></tr><tr><td>Passarinho com batata<div class=\"mdesc\">Pedacinhos de frango com ossos marinados ao vinho d’alho com crocante de alho e palitos de batatinhas fritas</div></td><td class=\"mprice\">R$ 69</td></tr><tr><td>Batata frita</td><td class=\"mprice\">R$ 36</td></tr><tr><td>Batata frita com cheddar e bacon</td><td class=\"mprice\">R$ 55</td></tr></table><h4>Pizzas — 25 cm (4 fatias) R$ 65 · 30 cm (6 fatias) R$ 85</h4><table class=\"menu\"><tr><td>Calabresa<div class=\"mdesc\">Massa especial, molho italiano, muçarela, fatias de calabresa e cebola</div></td><td class=\"mprice\"></td></tr><tr><td>Três Queijos<div class=\"mdesc\">Massa especial, molho italiano, muçarela, gorgonzola e parmesão</div></td><td class=\"mprice\"></td></tr><tr><td>Peito de Peru e Catupiry<div class=\"mdesc\">Massa especial, molho italiano, muçarela, peito de peru defumado e catupiry</div></td><td class=\"mprice\"></td></tr><tr><td>Muçarela<div class=\"mdesc\">Massa especial, molho italiano e queijo muçarela</div></td><td class=\"mprice\"></td></tr><tr><td>Frango e Catupiry<div class=\"mdesc\">Massa especial, molho italiano, muçarela, frango desfiado e catupiry</div></td><td class=\"mprice\"></td></tr><tr><td>Marguerita<div class=\"mdesc\">Massa especial, molho italiano, muçarela, tomate em fatias e manjericão</div></td><td class=\"mprice\"></td></tr><tr><td>Mini pizza (brotinho)</td><td class=\"mprice\">R$ 24</td></tr></table><h4>Açaí</h4><table class=\"menu\"><tr><td>Açaí 300 g</td><td class=\"mprice\">R$ 29</td></tr><tr><td>Açaí 500 g<div class=\"mdesc\">Consulte os complementos disponíveis</div></td><td class=\"mprice\">R$ 34</td></tr></table><h4>Bebidas</h4><table class=\"menu\"><tr><td>Água mineral sem gás</td><td class=\"mprice\">R$ 5</td></tr><tr><td>Água mineral com gás</td><td class=\"mprice\">R$ 8</td></tr><tr><td>H2O</td><td class=\"mprice\">R$ 15</td></tr><tr><td>Red Bull energético</td><td class=\"mprice\">R$ 20</td></tr><tr><td>Suco Del Valle</td><td class=\"mprice\">R$ 14</td></tr><tr><td>Suco de polpa</td><td class=\"mprice\">R$ 12</td></tr><tr><td>Suco natural</td><td class=\"mprice\">R$ 14</td></tr><tr><td>Refrigerante lata (Co em. 🍼</p><h4>Estrutura</h4><ul><li>Sala de TV</li><li>Berçário</li><li>Fraldário</li><li>Copa Baby</li></ul><p>Sabemos que os horários das refeições nem sempre coincidem com as necessidades dos bebês — não hesite em chamar nossa equipe se precisar de qualquer apoio.</p>", "cat": "comer"}, "emporio": {"t": "Empório Gava", "e": "🛒", "html": "<p>O Empório Gava é o lugar perfeito para quem busca aquele clima de buteco com um toque especial! Comidinhas de boteco, bebidas geladas e um ambiente rústico e acolhedor para relaxar com a família ou entre amigos. 🍻</p><div class=\"kvs\"><div class=\"kv\"><span>Todos os dias</span><b>10h às 22h</b></div></div><p><a class=\"cta\" href=\"https://drive.google.com/file/d/1f0gI3-EOX_-EAlIqwa33ylqq_1t2bLkZ/view\" target=\"_blank\" rel=\"noopener\">Ver cardápio com valores →</a></p>", "cat": "comer"}, "conveniencia": {"t": "Conveniência", "e": "🏪", "html": "<p>Nossa loja de conveniência funciona de segunda a segunda! Lá você encontra lembrancinhas, roupas, bebidas, guloseimas, itens de higiene pessoal e muito mais. 🏪</p><h4>Horário de funcionamento</h4><div class=\"kvs\"><div class=\"kv\"><span>Segunda a quinta</span><b>9h30 às 21h30</b></div><div class=\"kv\"><span>Sexta</span><b>10h30 às 22h30</b></div><div class=\"kv\"><span>Sábado e domingo</span><b>9h30 às 21h30</b></div><div class=\"kv\"><span>Férias (jan, jul e dez)</span><b>todos os dias, 9h30 às 21h30</b></div></div><p class=\"obs\">Em julho, o horário de férias vale de 10/07 a 26/07.</p>", "cat": "comer"}, "informacoes": {"t": "Informações Gerais", "e": "ℹ️", "html": "<h4>Voltagem</h4><p>Todas as tomadas são <strong>220 V</strong>. Antes de ligar seus aparelhos, verifique se são bivolt ou compatíveis com essa voltagem.</p><h4>Ramais úteis</h4><div class=\"kvs\"><div class=\"kv\"><span>Recepção</span><b>9</b></div><div class=\"kv\"><span>Centro de Vivências (lanchonete)</span><b>211</b></div><div class=\"kv\"><span>Empório Gava</span><b>100</b></div></div><h4>Telefones</h4><p>(27) 3441-9770 · (27) 3208-0861 · (27) 99720-2553</p><h4>Wi-Fi</h4><div class=\"kvs\"><div class=\"kv\"><span>Rede</span><b>China Park</b></div><div class=\"kv\"><span>Senha</span><b>china2019</b></div></div><h4>Cobertura de celular</h4><p>Apenas pela operadora Vivo.</p><h4>Frigobar</h4><p>O frigobar é abastecido com águas sem gás — se consumidas, são lançadas na sua conta ao final da estadia. Para abastecer com outros produtos, ligue para a recepção ou adquira diretamente nos restaurantes, lanchonetes ou na loja de conveniência.</p><h4>Taxas</h4><div class=\"kvs\"><div class=\"kv\"><span>Taxa de turismo</span><b>R$ 1,90 por diária</b></div><div class=\"kv\"><span>Seguro pessoal</span><b>R$ 3,90 por pessoa</b></div><div class=\"kv\"><span>Estacionamento</span><b>R$ 10,00 por veículo</b></div></div><p class=\"obs\">Não cobramos ISS.</p><h4>Restrição alimentar</h4><p>Informe na recepção para que a cozinha seja avisada e inclua opções na produção. No café da manhã e no café da tarde já há bolos sem lactose.</p><h4>Solicitação de bolo</h4><p>Diretamente na recepção, com no mínimo 24 horas de antecedência.</p><h4>Crianças pequenas</h4><p>Crianças que dependem de ajuda (troca de fraldas, banheiro etc.) devem estar sempre acompanhadas de um responsável no Brinquedão e nas atividades da Recreação.</p><h4>Varandas</h4><p>Pedimos que não estenda roupas ou toalhas nas varandas e janelas dos chalés e apartamentos.</p>", "cat": "servicos"}, "checkout": {"t": "Check-out", "e": "🧳", "html": "<div class=\"kvs\"><div class=\"kv\"><span>Horário do check-out</span><b>até 12h (meio-dia)</b></div></div><p>Basta entregar a chave na recepção.</p><h4>Almoço no dia da saída</h4><p>Reserva com <strong>pensão completa</strong>? O almoço do dia do check-out está incluso: entregue a chave e siga direto para o restaurante, sem fila. Sem almoço incluso, aproveite o buffet a quilo do Restaurante dos Lagos.</p><h4>Quer ficar mais um pouco?</h4><p>Após o almoço, dá para aproveitar as áreas de lazer <strong>até as 17h</strong>: passe na recepção e troque a cor da sua pulseira.</p><h4>Comanda</h4><p>O fechamento da comanda é feito apenas no momento da saída do hotel, na recepção.</p><h4>Malas e transporte</h4><p>Nossa equipe ajuda com bagagens e transporte — avise com antecedência para atendermos com agilidade.</p><p>Agradecemos sua estadia conosco! 💙</p>", "cat": "servicos"}, "servico-quarto": {"t": "Serviço de Quarto", "e": "🛏️", "html": "<p>Dúvidas frequentes sobre a governança (arrumação e limpeza):</p><details class=\"faq\"><summary>A limpeza do quarto é feita todos os dias?</summary><div class=\"faq-a\"><p>Sim. A arrumação diária acontece entre 9h e 16h. Se não desejar a entrada da equipe, é só colocar a placa de \"Não Perturbe\" na porta.</p></div></details><details class=\"faq\"><summary>Posso solicitar troca de toalhas ou roupas de cama?</summary><div class=\"faq-a\"><p>Sim. Toalhas são trocadas diariamente ou sob solicitação; roupas de cama, em caso de necessidade ou mediante pedido.</p></div></details><details class=\"faq\"><summary>Posso agendar um horário específico para a limpeza?</summary><div class=\"faq-a\"><p>Sim. Informe na recepção ou pendure a placa \"Livre para Limpeza\". Faremos o possível, conforme a disponibilidade da equipe.</p></div></details><details class=\"faq\"><summary>Esqueci a placa \"Não Perturbe\" e entraram no quarto. E agora?</summary><div class=\"faq-a\"><p>Pedimos desculpas — nossa equipe sempre respeita a sinalização. Se acontecer, avise a recepção imediatamente para corrigirmos a falha.</p></div></details><details class=\"faq\"><summary>A governança lava ou passa roupas dos hóspedes?</summary><div class=\"faq-a\"><p>Não, esse serviço não é realizado pela governança. Em casos emergenciais há serviço de lavanderia — consulte a recepção.</p></div></details><details class=\"faq\"><summary>Esqueci um item no quarto. O que acontece?</summary><div class=\"faq-a\"><p>Itens esquecidos vão para a recepção e ficam guardados por até 45 dias. Entre em contato o quanto antes para recuperá-los.</p></div></details><details class=\"faq\"><summary>A governança repõe as amenidades?</summary><div class=\"faq-a\"><p>Sim, mediante solicitação.</p></div></details><details class=\"faq\"><summary>Posso pedir uma limpeza extra fora do horário?</summary><div class=\"faq-a\"><p>Sim, conforme a disponibilidade da equipe. Solicite na recepção.</p></div></details><h4>Informações importantes</h4><ul><li>Não é permitido pendurar roupas nas varandas.</li><li>É proibido fumar nas acomodações, varandas e corredores.</li><li>O enxoval (toalhas, roupas de cama etc.) é de uso exclusivo dos hóspedes — não pode ser usado para pets.</li><li>Danos causados ao enxoval ou à acomodação (inclusive por pets) serão cobrados.</li></ul>", "cat": "servicos"}, "toalhas": {"t": "Toalhas para Piscina", "e": "🏖️", "html": "<p>Hóspedes com pulseira <strong>roxa, branca, dourada ou amarela</strong> têm direito a 1 toalha gratuita por pessoa para uso nas piscinas. Para os demais, é cobrada uma taxa de <strong>R$ 15,00</strong> por toalha. 🏖️</p><h4>Retirada e devolução</h4><ul><li>Portaria do Parque Aquático</li><li>Centro de Vivências</li></ul><p class=\"obs\">A devolução pode ser feita em qualquer um dos dois locais.</p>", "cat": "servicos"}, "emprestimos": {"t": "Empréstimos", "e": "🤝", "html": "<p>Pensando no seu conforto, disponibilizamos itens para empréstimo durante a estada. 🤝</p><h4>Retirada na loja de conveniência</h4><div class=\"kvs\"><div class=\"kv\"><span>Transformador de energia</span><b>até 24h</b></div><div class=\"kv\"><span>Ferro de passar</span><b>até 1h</b></div></div><h4>Solicitados na recepção (entregues no quarto)</h4><ul><li>Varal de chão</li><li>Banheira para bebê</li><li>Grade de segurança para cama</li><li>Cadeira de banho</li><li>Ventilador</li></ul><h4>Outros itens</h4><ul><li><strong>Toalhas para piscina</strong> — retirada na portaria do Parque Aquático ou na lanchonete do Centro de Vivências (1 toalha por pessoa por dia).</li><li><strong>Micro-ondas</strong> — taxa única de R$ 100,00 por hospedagem (sócios cotistas são isentos).</li></ul><p class=\"obs\">Todos os itens estão sujeitos à disponibilidade.</p>", "cat": "servicos"}, "lavanderia": {"t": "Lavanderia", "e": "👕", "html": "<p>O resort não possui serviço de lavanderia regular para hóspedes — mas, em <strong>casos de emergência</strong>, oferecemos um atendimento especial. 👕</p><ul><li>As peças são cobradas por tamanho e unidade.</li><li>Valores e procedimentos: consulte a recepção.</li></ul>", "cat": "servicos"}, "primeiros-socorros": {"t": "Primeiros Socorros", "e": "⛑️", "html": "<p>Contamos com uma Sala de Primeiros Socorros com técnico de enfermagem para atendimentos iniciais e avaliações básicas. ⛑️</p><div class=\"kvs\"><div class=\"kv\"><span>Local</span><b>Parque Aquático</b></div><div class=\"kv\"><span>Plantão</span><b>8h às 18h</b></div></div><p>Casos que exigem maior atenção são encaminhados ao pronto-socorro mais próximo.</p><p class=\"obs\">Fora do horário de plantão, acione a recepção.</p>", "cat": "servicos"}, "achados-perdidos": {"t": "Achados e Perdidos", "e": "🔍", "html": "<p>Objetos esquecidos nas dependências do resort são encaminhados à recepção ou à loja de conveniência. 🔍</p><div class=\"kvs\"><div class=\"kv\"><span>Prazo de guarda</span><b>até 45 dias</b></div></div><p class=\"obs\">Após esse prazo, conforme nosso Manual de Conduta Hoteleira, os objetos não retirados são descartados.</p>", "cat": "servicos"}, "pet": {"t": "Pet Friendly", "e": "🐾", "html": "<p>Seu aumiguinho é muito bem-vindo! Pets podem se hospedar com você em chalés ou apartamentos, seguindo algumas regrinhas: 🐾</p><ul><li>Acesso liberado às áreas comuns, <strong>exceto</strong> áreas de alimentação e áreas molhadas (Parque Aquático e piscinas aquecidas).</li><li>Para a limpeza do quarto, o pet não deve estar na acomodação — agende a limpeza com a recepção.</li><li>Aceitamos pets de pequeno e médio porte.</li></ul><p class=\"obs\">Ficou com dúvidas? Nossa equipe está à disposição.</p>", "cat": "servicos"}, "spa": {"t": "Essence Spa", "e": "💆", "html": "<p>Além de toda a aventura, o China Park também oferece um espaço tranquilo e acolhedor para quem busca relaxar e se reconectar. A massagem é mais do que descanso: é um momento de cuidado com o próprio corpo. 💆</p><div class=\"kvs\"><div class=\"kv\"><span>Valor (qualquer massagem)</span><b>R$ 200,00</b></div></div><h4>Agendamento</h4><p>Na recepção do Spa — em frente ao Brinquedão ou no anexo ao lado do Restaurante dos Lagos — ou na recepção do resort.</p><p>Reserve um tempo só seu. Você merece esse cuidado!</p>", "cat": "servicos"}, "capela": {"t": "Capela Ecumênica", "e": "⛪", "html": "<p>O China Park Eco Resort disponibiliza uma capela ecumênica: um espaço de paz, reflexão e conexão espiritual, aberto para orações, rezas ou qualquer forma de expressão da sua fé. ⛪</p><div class=\"kvs\"><div class=\"kv\"><span>Culto especial</span><b>segundas-feiras, 19h</b></div></div><p>Sinta-se à vontade para visitar e aproveitar esse momento de serenidade.</p>", "cat": "servicos"}, "espacos": {"t": "Espaços do Resort", "e": "🗺️", "html": "\n<p>Os principais espaços do resort, para você se localizar:</p>\n<h4>Lazer e aventura</h4>\n<ul>\n<li><strong>Parque Aquático</strong> — piscinas (9h às 17h) e Hidroshow</li>\n<li><strong>Centro Termal</strong> — piscinas aquecidas cobertas</li>\n<li><strong>Teleférico</strong> — cartão-postal da região</li>\n<li><strong>Tirolesa e Arvorismo</strong> — circuito de aventura</li>\n<li><strong>Trilha Ecológica</strong> — ~40 min em meio à natureza</li>\n<li><strong>Lagos</strong> — pesca recreativa (pesque e solte) e pedalinhos</li>\n<li><strong>Casa de Campo</strong> — fazendinha e contato com animais</li>\n</ul>\n<h4>Esporte</h4>\n<ul>\n<li><strong>Quadra Coberta</strong> · <strong>Campo Society</strong> · <strong>Quadra de Tênis</strong> · <strong>Quadra de Beach Tennis</strong> · <strong>Academia</strong> (7h às 20h)</li>\n</ul>\n<h4>Crianças e família</h4>\n<ul>\n<li><strong>Brinquedão</strong> — parque coberto</li>\n<li><strong>Espaço Kids</strong> — recreação infantil</li>\n<li><strong>Praça Estação da Alegria</strong> — ponto de encontro e embarque do trenzinho</li>\n<li><strong>Cine-Chininha</strong> — sessões diárias</li>\n<li><strong>Copa Baby</strong> — aberta 24h</li>\n</ul>\n<h4>Gastronomia e convivência</h4>\n<ul>\n<li><strong>Centro Gourmet</strong> — Restaurante Gourmet (buffet) e refeições</li>\n<li><strong>Restaurante dos Lagos</strong> — self-service a quilo</li>\n<li><strong>Lanchonete do Centro de Vivências</strong> — lanches e delivery</li>\n<li><strong>Centro de Vivências</strong> — salão de jogos, sinuca e atividades noturnas</li>\n<li><strong>Empório Gava</strong> e <strong>Conveniência</strong></li>\n</ul>\n<h4>Serviços</h4>\n<ul>\n<li><strong>Recepção</strong> · <strong>Essence Spa</strong> · <strong>Sala de Primeiros Socorros</strong> · <strong>Capela Ecumênica</strong> · <strong>Lavanderia</strong></li>\n</ul>\n", "cat": "planeje"}}};

function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}

function renderHome(){
  var box = document.getElementById('cats'); box.innerHTML = '';
  G.cats.forEach(function(cat){
    var tiles = cat.items.map(function(it){
      var href, extra = '';
      if (it.ext) { href = it.ext; if (href.indexOf('http') === 0) extra = ' target="_blank" rel="noopener"'; }
      else href = '#/' + it.slug;
      var badge = it.badge ? '<span class="tile-badge">' + esc(it.badge) + '</span>' : '';
      if (it.dest && !it.badge) badge = '<span class="tile-badge">✨ Exclusivo</span>';
      return '<a class="tile' + (it.dest ? ' tile-dest' : '') + '" href="' + esc(href) + '"' + extra + '>' + badge +
             '<span class="tile-ico">' + esc(it.e) + '</span><span class="tile-lbl">' + esc(it.t) + '</span></a>';
    }).join('');
    var sec = document.createElement('section'); sec.className = 'cat';
    sec.innerHTML = '<h2>' + esc(cat.title) + '</h2><div class="grid">' + tiles + '</div>';
    box.appendChild(sec);
  });
  applySearch();
}

function relatedChips(slug){
  var cat = G.pages[slug].cat, chips = [];
  for (var s in G.pages) {
    if (s !== slug && G.pages[s].cat === cat) chips.push(s);
    if (chips.length >= 4) break;
  }
  if (!chips.length) return '';
  return '<h3>Veja também</h3><div class="rel-row">' + chips.map(function(s){
    return '<a class="rel-chip" href="#/' + s + '">' + esc(G.pages[s].e) + ' ' + esc(G.pages[s].t) + '</a>';
  }).join('') + '</div>';
}

function route(){
  var slug = (location.hash || '#/').replace(/^#\//, '');
  var p = G.pages[slug];
  if (p) {
    document.getElementById('pg-em').textContent = p.e;
    document.getElementById('pg-title').textContent = p.t;
    document.getElementById('pg-body').innerHTML = p.html;
    document.getElementById('pg-hero').className = 'pg-hero c-' + p.cat;
    document.getElementById('related').innerHTML = relatedChips(slug);
    document.title = 'China Park · ' + p.t;
    document.body.classList.add('viewing');
    window.scrollTo(0, 0);
  } else {
    document.body.classList.remove('viewing');
    document.title = 'China Park · Guia do Hóspede';
  }
}

function applySearch(){
  var q = document.getElementById('search').value.trim().toLowerCase();
  document.querySelectorAll('.cat').forEach(function(cat){
    var any = false;
    cat.querySelectorAll('.tile').forEach(function(t){
      var hit = !q || t.textContent.toLowerCase().indexOf(q) !== -1;
      t.classList.toggle('hidden', !hit);
      if (hit) any = true;
    });
    cat.classList.toggle('hidden', !any);
  });
}

document.getElementById('search').addEventListener('input', applySearch);
window.addEventListener('hashchange', route);
renderHome();
route();

// versão publicada pela equipe substitui o padrão
fetch('/api/recreacao', {cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
  if (d && d.guia && d.guia.cats && d.guia.pages) {
    G = d.guia;
    renderHome();
    route();
  }
}).catch(function(){});
</script>
